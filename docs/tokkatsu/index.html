<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>学習指導要領 特別活動</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 学習指導要領（特別活動）を引く画面。データは下の tk-data 1か所（tools/build_tokkatsu.py が入れる）。
   つなぎは国語と同じ：#82N1203110000000 のようにコードを付けて開く／postMessage {type:'yoryo-open',code}／選んだ項目は {type:'yoryo-pick',...} で渡す。 */
:root{color-scheme:light;--tk-ink:#22252a;--tk-sub:#4a5260;--tk-line:#d6dbe2;--tk-soft:#f5f7fa;--tk-blue:#1a4fa0;--tk-blue2:#e8eef8;--tk-new:#8a4b00;--tk-new2:#fff3df;--tk-ins:#fff0a8;
 --tk-g:"BIZ UDPGothic","BIZ UDPゴシック","BIZ UDGothic","BIZ UDゴシック","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
html,body{height:100%;margin:0}body{background:#fff;color:var(--tk-ink);font-family:var(--tk-g);font-size:16px;letter-spacing:.03em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*{box-sizing:border-box}[hidden]{display:none!important}
button,input{font:inherit;color:var(--tk-ink);letter-spacing:inherit}input{background:#fff}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--tk-blue);outline-offset:2px}
#tk-app{height:100%;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px 14px;max-width:1400px;margin:0 auto}
#tk-app button{min-height:44px;min-width:44px;border:1px solid #9aa3ad;border-radius:8px;background:#fff;padding:6px 12px;cursor:pointer;white-space:nowrap}
#tk-app button[aria-pressed=true]{background:var(--tk-blue2);border-color:var(--tk-blue);color:var(--tk-blue);font-weight:700}
#tk-app button.tk-main{background:var(--tk-blue);border-color:var(--tk-blue);color:#fff;font-weight:700}
#tk-app button:disabled{opacity:.45;cursor:default}
/* 上：名前・見かた・さがす */
.tk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-head h1{margin:0 6px 0 0;font-size:20px;font-weight:700;white-space:nowrap}
.tk-seg{display:flex;border:1px solid #9aa3ad;border-radius:8px;overflow:hidden}
#tk-app .tk-seg button{border:0;border-radius:0;border-right:1px solid var(--tk-line)}#tk-app .tk-seg button:last-child{border-right:0}
.tk-sp{flex:1}
.tk-find{display:flex;align-items:center;gap:4px;border:1px solid #9aa3ad;border-radius:8px;padding:0 4px 0 10px;min-height:44px;width:min(210px,100%)}
.tk-find input{border:0;outline:0;flex:1;min-width:0;min-height:40px;font-size:16px}
#tk-app .tk-find button{border:0;min-width:40px;padding:0;color:var(--tk-sub)}
.tk-ic{width:20px;height:20px;flex:none;vertical-align:-4px}
/* 中：左に一覧、右に中身 */
.tk-body{flex:1;min-height:0;display:flex;gap:10px}
.tk-nav{flex:0 0 200px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.tk-nav h2{margin:8px 0 0;font-size:14px;color:var(--tk-sub);font-weight:700;border-bottom:1px solid var(--tk-line);padding-bottom:2px}.tk-nav h2:first-child{margin-top:0}
#tk-app .tk-nav button{flex:none;text-align:left;border:1px solid var(--tk-line);background:#fff;white-space:normal;line-height:1.35;padding:7px 10px}
#tk-app .tk-nav button:hover{background:var(--tk-soft);border-color:#9aa3ad}
#tk-app .tk-nav button[aria-pressed=true]{border:2px solid var(--tk-blue);padding:6px 9px;background:var(--tk-blue2)}
.tk-nav{gap:5px!important;padding:2px 4px 2px 0}
.tk-nav small{display:block;font-size:14px;color:var(--tk-sub);font-weight:400}
.tk-pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--tk-line);border-radius:8px;overflow:hidden}
.tk-ttl{display:flex;align-items:center;gap:10px;padding:2px 4px 2px 12px;min-height:44px;border-bottom:1px solid var(--tk-line);background:var(--tk-soft);flex-wrap:wrap}
.tk-ttl b{font-size:17px}.tk-ttl span{font-size:14px;color:var(--tk-sub)}
#tk-app .tk-ttl button{padding:2px 10px;font-size:15px}
.tk-list{flex:1;min-height:0;overflow:auto;line-height:1.75}
/* 本文の1項目 */
.tk-r{display:grid;grid-template-columns:1fr 44px;gap:6px;border-bottom:1px solid var(--tk-line);padding:6px 4px 6px 12px}
.tk-r>div{max-width:46em}.tk-nx,.tk-lead{max-width:none}.tk-nx>*:not(.d),.tk-y ul{max-width:46em}
.tk-r.l0{background:var(--tk-soft)}.tk-r.l2{padding-left:30px}
.tk-r.hit{outline:3px solid #b8860b;outline-offset:-3px}
.tk-r.on{background:var(--tk-blue2)}
.tk-n{font-weight:700;color:var(--tk-blue);margin-right:.5em}
.tk-h{font-weight:700}
.tk-t{display:block}
#tk-app .tk-ck{align-self:start;border:0;padding:0;background:none}
.tk-ck i{display:flex;width:24px;height:24px;margin:auto;border:2px solid #9aa3ad;border-radius:4px;align-items:center;justify-content:center}
.tk-r.on .tk-ck i{background:var(--tk-blue);border-color:var(--tk-blue)}
.tk-r.on .tk-ck i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:-3px}
/* しるし：新しく入った・変わった（字で伝える） */
.tk-tag{display:inline-block;font-size:14px;line-height:1.4;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tk-tag.new{color:var(--tk-new);background:var(--tk-new2)}
.tk-tag.chg,.tk-tag.move{color:var(--tk-blue);background:#fff}
.tk-tag.same{color:var(--tk-sub);background:#fff}
.tk-tag.gone{color:#6b3a8a;background:#fff}
.tk-tag.kettei{color:#155f2e;background:#e9f6ed}.tk-tag.shingi{color:var(--tk-new);background:var(--tk-new2)}.tk-tag.yotei{color:var(--tk-blue);background:var(--tk-blue2)}
#tk-app a.tk-cmp{font-size:14px;color:var(--tk-blue);margin-left:6px;white-space:nowrap}
/* 用語：本文の中で点線の下線。押すと下に意味 */
a.tk-w{color:inherit;text-decoration:underline dotted var(--tk-blue) 2px;text-underline-offset:4px;cursor:help}
.tk-card{border-top:2px solid var(--tk-blue);background:#fff;padding:8px 12px;max-height:40%;overflow:auto;line-height:1.7}
.tk-card b{font-size:17px}.tk-card .y{font-size:14px;color:var(--tk-sub);margin-left:8px}
.tk-card p{margin:4px 0}
.tk-ent{max-height:none;border-top:0;border-bottom:1px solid var(--tk-line);padding:10px 12px}.tk-ent.on{background:var(--tk-blue2)}.tk-ent p{max-width:46em}
#tk-app .tk-card .x{float:right;border:0;font-size:20px;color:var(--tk-sub)}
/* くらべる：左に前回、右にいま */
.tk-cmpg{display:grid;grid-template-columns:1fr 1fr}
.tk-cmpg>div{min-width:0;padding:6px 12px;border-bottom:1px solid var(--tk-line)}
.tk-cmpg>div:nth-child(odd){border-right:1px solid var(--tk-line)}
.tk-colh{position:sticky;top:0;z-index:1;background:#fff;font-weight:700}
.tk-note{grid-column:1/-1;background:var(--tk-soft);font-size:15px;line-height:1.6}
.tk-cmpg .tk-x{color:var(--tk-sub);font-size:14px}
del{text-decoration:line-through 2px;color:#6a707a}
ins{text-decoration:underline 2px;text-underline-offset:3px;background:var(--tk-ins)}
/* 歩み */
.tk-y{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 12px;border-bottom:1px solid var(--tk-line)}
.tk-y.now{background:var(--tk-blue2)}.tk-y.next{background:var(--tk-new2)}
.tk-y .yy{font-size:22px;font-weight:700;line-height:1.2}.tk-y .yy small{display:block;font-size:14px;font-weight:400;color:var(--tk-sub)}
.tk-y h3{margin:0;font-size:17px}
.tk-y ul{margin:4px 0 0;padding-left:1.2em}
.tk-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tk-chips span{max-width:100%;overflow-wrap:anywhere;font-size:14px;border:1px solid var(--tk-line);border-radius:4px;padding:0 6px;background:#fff}
/* 歩みの図：年を横、活動を縦の帯に。帯が切れた所が変わった所 */
.tk-fig{padding:10px 12px;overflow-x:auto}
.tk-fg{display:grid;grid-template-columns:64px repeat(10,minmax(62px,1fr));gap:6px 3px;min-width:720px;align-items:stretch}
.tk-fg .yh{font-weight:700;text-align:center;font-size:15px;line-height:1.3;padding-bottom:2px;border-bottom:2px solid var(--tk-line)}
.tk-fg .yh small{display:block;font-size:14px;font-weight:400;color:var(--tk-sub)}
.tk-fg .yh.now{color:var(--tk-blue);border-color:var(--tk-blue)}.tk-fg .yh.next{color:var(--tk-new);border-color:var(--tk-new)}
.tk-fg .ln{font-weight:700;font-size:15px;display:flex;align-items:center}
#tk-app .tk-fg .sg{min-height:52px;white-space:normal;line-height:1.35;font-size:14px;padding:4px 6px;border-radius:6px;border:1px solid #8fa6c8;background:var(--tk-blue2);color:var(--tk-ink);text-align:center}
#tk-app .tk-fg .sg.nx{border:2px dashed var(--tk-new);background:#fff}
#tk-app .tk-fg .sg.em{border:1px dashed var(--tk-line);background:#fff;color:var(--tk-sub)}
#tk-app .tk-fg .sg.nm{background:#fff;border-color:var(--tk-ink);font-weight:700}
.tk-fgk{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--tk-sub);margin-top:10px}
.tk-fgk i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #8fa6c8;background:var(--tk-blue2)}
.tk-fgk i.nx{border:2px dashed var(--tk-new);background:#fff}
/* 次の改訂 */
.tk-nx{padding:8px 12px;border-bottom:1px solid var(--tk-line)}
.tk-nx .d{font-size:14px;color:var(--tk-sub)}
.tk-nx a{color:var(--tk-blue);font-size:14px}
.tk-lead{padding:10px 12px;border-bottom:1px solid var(--tk-line);background:var(--tk-soft)}
/* さがす */
.tk-grp{padding:6px 12px 2px;font-size:14px;color:var(--tk-sub);font-weight:700;background:#fff;position:sticky;top:0}
#tk-app .tk-res{display:block;width:100%;text-align:left;white-space:normal;border:0;border-bottom:1px solid var(--tk-line);border-radius:0;padding:6px 12px;line-height:1.6}
#tk-app .tk-res:hover{background:var(--tk-soft)}
.tk-res .w{display:block;font-size:14px;color:var(--tk-sub)}
mark{background:var(--tk-ins);color:inherit}
.tk-none{padding:16px;color:var(--tk-sub)}
/* 下：選んだもの */
.tk-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
.tk-picked{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--tk-sub);font-size:14px}
.tk-src{font-size:14px;color:var(--tk-sub);line-height:1.4}
.tk-toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--tk-ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px}
.tk-sm,.tk-steps,.tk-figv{display:none}
.tk-fgv{display:grid;grid-template-columns:50px repeat(5,minmax(0,1fr));gap:3px 3px;align-items:stretch}
.tk-fgv .lh{position:sticky;top:0;z-index:1;background:#fff;font-weight:700;font-size:14px;text-align:center;line-height:1.3;padding:4px 0;border-bottom:2px solid var(--tk-line)}
.tk-fgv .yy{font-weight:700;font-size:15px;line-height:1.2;display:flex;flex-direction:column;justify-content:center;border-right:2px solid var(--tk-line);padding-right:2px}
.tk-fgv .yy small{font-size:14px;font-weight:400;color:var(--tk-sub)}
.tk-fgv .yy.now{color:var(--tk-blue);border-color:var(--tk-blue)}.tk-fgv .yy.next{color:var(--tk-new);border-color:var(--tk-new)}
#tk-app .tk-fgv .sg{min-height:48px;min-width:0;white-space:normal;line-height:1.3;font-size:14px;padding:4px 2px;border-radius:6px;border:1px solid #8fa6c8;background:var(--tk-blue2);color:var(--tk-ink);text-align:center;overflow-wrap:anywhere;letter-spacing:0}
#tk-app .tk-fgv .sg.nx{border:2px dashed var(--tk-new);background:#fff}
#tk-app .tk-fgv .sg.em{border:1px dashed var(--tk-line);background:#fff;color:var(--tk-sub)}
#tk-app .tk-fgv .sg.nm{background:#fff;border-color:var(--tk-ink);font-weight:700}
@media (max-width:760px){
 /* スマホ：上は名前・見かた・さがす を3段。一覧は折り返して全部見える。出典は中身のいちばん下へ */
 #tk-app{padding:8px 12px calc(6px + env(safe-area-inset-bottom));gap:8px}.tk-body{flex-direction:column;gap:8px}
 .tk-lg{display:none}.tk-sm{display:block}
 .tk-head{gap:6px}.tk-head h1{font-size:18px;width:100%}.tk-sp{display:none}
 .tk-seg{display:grid;grid-template-columns:repeat(5,1fr);width:100%}
 #tk-app #tk-mode button{padding:4px 2px;font-size:15px;white-space:normal;line-height:1.25}
 .tk-ttl .tk-seg{display:flex;width:auto}
 .tk-find{width:100%}
 .tk-nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px!important;padding:0}.tk-nav h2{display:none}
 #tk-app .tk-nav button{text-align:center;padding:4px 4px;line-height:1.25;font-size:15px}
 #tk-app .tk-nav button[aria-pressed=true]{padding:3px 3px}
 .tk-nav small{display:none}
 #tk-app[data-mode=hist] .tk-nav,#tk-app[data-mode=next] .tk-nav,#tk-app[data-mode=term] .tk-nav,#tk-app[data-q] .tk-nav{display:none}
 .tk-pane{border-radius:10px}
 .tk-r{padding:8px 2px 8px 12px}.tk-r.l2{padding-left:20px}
 .tk-cmpg{grid-template-columns:1fr}.tk-cmpg>div:nth-child(odd){border-right:0}.tk-colh{display:none}
 .tk-cmpg .o::before,.tk-cmpg .n::before{display:inline-block;font-size:14px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin:0 8px 4px 0;line-height:1.5}
 .tk-cmpg .o::before{content:"前回 平成20年";color:var(--tk-sub)}.tk-cmpg .n::before{content:"いま 平成29年";color:var(--tk-blue)}
 .tk-cmpg .o{background:#fafbfc}
 .tk-y{grid-template-columns:1fr;gap:4px}
 .tk-fig{display:none}.tk-figv{display:block;padding:0 6px 8px}
 .tk-steps{display:block;margin:0;padding:8px 12px 8px 30px;border-bottom:1px solid var(--tk-line);font-size:15px;line-height:1.6}
 .tk-steps b{margin-right:8px}.tk-steps li.now{font-weight:700;color:var(--tk-new)}
 .tk-picked,.tk-src{display:none}
 .tk-foot{gap:6px;min-height:0}.tk-foot button{flex:1}
 #tk-app:not([data-picked]) .tk-foot{display:none}
 .tk-srcm{padding:10px 12px 16px;font-size:14px;color:var(--tk-sub);line-height:1.55}
 .tk-card{max-height:55%}
}
</style></head><body>
<div id="tk-app">
 <div class="tk-head">
  <h1>学習指導要領　特別活動</h1>
  <div class="tk-seg" id="tk-mode" role="group" aria-label="見かた">
   <button data-m="now"><span class="tk-lg">いまの</span>本文</button><button data-m="cmp"><span class="tk-lg">前回と</span>くらべる</button><button data-m="hist">歩み</button><button data-m="next">次の改訂</button><button data-m="term">用語</button>
  </div>
  <span class="tk-sp"></span>
  <label class="tk-find"><svg class="tk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="tk-q" type="search" placeholder="ことばで さがす" aria-label="ことばで さがす"><button id="tk-qx" hidden aria-label="けす">×</button></label>
 </div>
 <div class="tk-body">
  <nav class="tk-nav" id="tk-nav" aria-label="えらぶ"></nav>
  <section class="tk-pane"><div class="tk-ttl" id="tk-ttl"></div><div class="tk-list" id="tk-list"></div><div class="tk-card" id="tk-card" hidden role="region" aria-live="polite"></div></section>
 </div>
 <div class="tk-foot" id="tk-foot">
  <span class="tk-picked" id="tk-picked"></span>
  <button id="tk-clear" disabled>はずす</button>
  <button id="tk-copy" disabled><svg class="tk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg> 写す</button>
  <button id="tk-send" class="tk-main" disabled>授業メイトへ</button>
 </div>
 <div class="tk-src" id="tk-src"></div>
</div>
<div class="tk-toast" id="tk-toast" hidden role="status"></div>
<script type="application/json" id="tk-data">{"src": {"now": "小学校学習指導要領（平成29年告示）第６章 特別活動　学習指導要領コード【82V12】Ver1.2（文部科学省）", "old": "小学校学習指導要領（平成20年3月告示）第６章 特別活動（国立教育政策研究所 学習指導要領データベース）"}, "secs": [{"id": "goal", "n": "目標"}, {"id": "gakkyu", "n": "学級活動"}, {"id": "jidokai", "n": "児童会活動"}, {"id": "club", "n": "クラブ活動"}, {"id": "gyoji", "n": "学校行事"}, {"id": "keikaku", "n": "指導計画の作成と内容の取扱い"}], "now": {"goal": [{"id": "82N0100000000000", "n": "目標", "h": "", "t": "集団や社会の形成者としての見方・考え方を働かせ，様々な集団活動に自主的，実践的に取り組み，互いのよさや可能性を発揮しながら集団や自己の生活上の課題を解決することを通して，次のとおり資質・能力を育成することを目指す。", "lv": 0}, {"id": "82N0100100000000", "n": "(1)", "h": "", "t": "多様な他者と協働する様々な集団活動の意義や活動を行う上で必要となることについて理解し，行動の仕方を身に付けるようにする。", "lv": 1}, {"id": "82N0100200000000", "n": "(2)", "h": "", "t": "集団や自己の生活，人間関係の課題を見いだし，解決するために話し合い，合意形成を図ったり，意思決定したりすることができるようにする。", "lv": 1}, {"id": "82N0100300000000", "n": "(3)", "h": "", "t": "自主的，実践的な集団活動を通して身に付けたことを生かして，集団や社会における生活及び人間関係をよりよく形成するとともに，自己の生き方についての考えを深め，自己実現を図ろうとする態度を養う。", "lv": 1}], "gakkyu": [{"id": "82N1202000000000", "n": "目標", "h": "", "t": "学級や学校での生活をよりよくするための課題を見いだし，解決するために話し合い，合意形成し，役割を分担して協力して実践したり，学級での話合いを生かして自己の課題の解決及び将来の生き方を描くために意思決定して実践したりすることに，自主的，実践的に取り組むことを通して，第１の目標に掲げる資質・能力を育成することを目指す。", "lv": 0}, {"id": "82N1203000000000", "n": "内容", "h": "", "t": "１の資質・能力を育成するため，全ての学年において，次の各活動を通して，それぞれの活動の意義及び活動を行う上で必要となることについて理解し，主体的に考えて実践できるよう指導する。", "lv": 0}, {"id": "82N1203100000000", "n": "(1)", "h": "学級や学校における生活づくりへの参画", "t": "", "lv": 1}, {"id": "82N1203110000000", "n": "ア", "h": "学級や学校における生活上の諸問題の解決", "t": "学級や学校における生活をよりよくするための課題を見いだし，解決するために話し合い，合意形成を図り，実践すること。", "lv": 2}, {"id": "82N1203120000000", "n": "イ", "h": "学級内の組織づくりや役割の自覚", "t": "学級生活の充実や向上のため，児童が主体的に組織をつくり，役割を自覚しながら仕事を分担して，協力し合い実践すること。", "lv": 2}, {"id": "82N1203130000000", "n": "ウ", "h": "学校における多様な集団の生活の向上", "t": "児童会など学級の枠を超えた多様な集団における活動や学校行事を通して学校生活の向上を図るため，学級としての提案や取組を話し合って決めること。", "lv": 2}, {"id": "82N1203200000000", "n": "(2)", "h": "日常の生活や学習への適応と自己の成長及び健康安全", "t": "", "lv": 1}, {"id": "82N1203210000000", "n": "ア", "h": "基本的な生活習慣の形成", "t": "身の回りの整理や挨拶などの基本的な生活習慣を身に付け，節度ある生活にすること。", "lv": 2}, {"id": "82N1203220000000", "n": "イ", "h": "よりよい人間関係の形成", "t": "学級や学校の生活において互いのよさを見付け，違いを尊重し合い，仲よくしたり信頼し合ったりして生活すること。", "lv": 2}, {"id": "82N1203230000000", "n": "ウ", "h": "心身ともに健康で安全な生活態度の形成", "t": "現在及び生涯にわたって心身の健康を保持増進することや，事件や事故，災害等から身を守り安全に行動すること。", "lv": 2}, {"id": "82N1203240000000", "n": "エ", "h": "食育の観点を踏まえた学校給食と望ましい食習慣の形成", "t": "給食の時間を中心としながら，健康によい食事のとり方など，望ましい食習慣の形成を図るとともに，食事を通して人間関係をよりよくすること。", "lv": 2}, {"id": "82N1203300000000", "n": "(3)", "h": "一人一人のキャリア形成と自己実現", "t": "", "lv": 1}, {"id": "82N1203310000000", "n": "ア", "h": "現在や将来に希望や目標をもって生きる意欲や態度の形成", "t": "学級や学校での生活づくりに主体的に関わり,自己を生かそうとするとともに，希望や目標をもち，その実現に向けて日常の生活をよりよくしようとすること。", "lv": 2}, {"id": "82N1203320000000", "n": "イ", "h": "社会参画意識の醸成や働くことの意義の理解", "t": "清掃などの当番活動や係活動等の自己の役割を自覚して協働することの意義を理解し，社会の一員として役割を果たすために必要となることについて主体的に考えて行動すること。", "lv": 2}, {"id": "82N1203330000000", "n": "ウ", "h": "主体的な学習態度の形成と学校図書館等の活用", "t": "学ぶことの意義や現在及び将来の学習と自己実現とのつながりを考えたり，自主的に学習する場としての学校図書館等を活用したりしながら，学習の見通しを立て，振り返ること。", "lv": 2}, {"id": "82N1205000000000", "n": "内容の取扱い", "h": "", "t": "", "lv": 0}, {"id": "82N1205100000000", "n": "(1)", "h": "", "t": "指導に当たっては，各学年段階で特に次の事項に配慮すること。", "lv": 1}, {"id": "82N12A5110000000", "n": "1・2年", "h": "", "t": "話合いの進め方に沿って，自分の意見を発表したり，他者の意見をよく聞いたりして，合意形成して実践することのよさを理解すること。基本的な生活習慣や，約束やきまりを守ることの大切さを理解して行動し，生活をよくするための目標を決めて実行すること。", "lv": 2}, {"id": "82N12C5120000000", "n": "3・4年", "h": "", "t": "理由を明確にして考えを伝えたり，自分と異なる意見も受け入れたりしながら，集団としての目標や活動内容について合意形成を図り，実践すること。自分のよさや役割を自覚し，よく考えて行動するなど節度ある生活を送ること。", "lv": 2}, {"id": "82N12D5130000000", "n": "5・6年", "h": "", "t": "相手の思いを受け止めて聞いたり，相手の立場や考え方を理解したりして，多様な意見のよさを積極的に生かして合意形成を図り，実践すること。高い目標をもって粘り強く努力し，自他のよさを伸ばし合うようにすること。", "lv": 2}, {"id": "82N1205200000000", "n": "(2)", "h": "", "t": "２の(3)の指導に当たっては，学校，家庭及び地域における学習や生活の見通しを立て，学んだことを振り返りながら，新たな学習や生活への意欲につなげたり，将来の生き方を考えたりする活動を行うこと。その際，児童が活動を記録し蓄積する教材等を活用すること。", "lv": 1}], "jidokai": [{"id": "82N2202000000000", "n": "目標", "h": "", "t": "異年齢の児童同士で協力し，学校生活の充実と向上を図るための諸問題の解決に向けて，計画を立て役割を分担し，協力して運営することに自主的，実践的に取り組むことを通して，第１の目標に掲げる資質・能力を育成することを目指す。", "lv": 0}, {"id": "82N2203000000000", "n": "内容", "h": "", "t": "１の資質・能力を育成するため，学校の全児童をもって組織する児童会において，次の各活動を通して，それぞれの活動の意義及び活動を行う上で必要となることについて理解し，主体的に考えて実践できるよう指導する。", "lv": 0}, {"id": "82N2203010000000", "n": "(1)", "h": "児童会の組織づくりと児童会活動の計画や運営", "t": "児童が主体的に組織をつくり，役割を分担し，計画を立て，学校生活の課題を見いだし解決するために話し合い，合意形成を図り実践すること。", "lv": 1}, {"id": "82N2203020000000", "n": "(2)", "h": "異年齢集団による交流", "t": "児童会が計画や運営を行う集会等の活動において，学年や学級が異なる児童と共に楽しく触れ合い，交流を図ること。", "lv": 1}, {"id": "82N2203030000000", "n": "(3)", "h": "学校行事への協力", "t": "学校行事の特質に応じて，児童会の組織を活用して，計画の一部を担当したり，運営に協力したりすること。", "lv": 1}, {"id": "82N2205000000000", "n": "内容の取扱い", "h": "", "t": "", "lv": 0}, {"id": "82N2205100000000", "n": "(1)", "h": "", "t": "児童会の計画や運営は，主として高学年の児童が行うこと。その際，学校の全児童が主体的に活動に参加できるものとなるよう配慮すること。", "lv": 1}], "club": [{"id": "82N3202000000000", "n": "目標", "h": "", "t": "異年齢の児童同士で協力し，共通の興味・関心を追求する集団活動の計画を立てて運営することに自主的，実践的に取り組むことを通して，個性の伸長を図りながら，第１の目標に掲げる資質・能力を育成することを目指す。", "lv": 0}, {"id": "82N3203000000000", "n": "内容", "h": "", "t": "１の資質・能力を育成するため，主として第４学年以上の同好の児童をもって組織するクラブにおいて，次の各活動を通して，それぞれの活動の意義及び活動を行う上で必要となることについて理解し，主体的に考えて実践できるよう指導する。", "lv": 0}, {"id": "82N3203100000000", "n": "(1)", "h": "クラブの組織づくりとクラブ活動の計画や運営", "t": "児童が活動計画を立て，役割を分担し，協力して運営に当たること。", "lv": 1}, {"id": "82N3203200000000", "n": "(2)", "h": "クラブを楽しむ活動", "t": "異なる学年の児童と協力し，創意工夫を生かしながら共通の興味・関心を追求すること。", "lv": 1}, {"id": "82N3203300000000", "n": "(3)", "h": "クラブの成果の発表", "t": "活動の成果について，クラブの成員の発意・発想を生かし，協力して全校の児童や地域の人々に発表すること。", "lv": 1}], "gyoji": [{"id": "82N5202000000000", "n": "目標", "h": "", "t": "全校又は学年の児童で協力し，よりよい学校生活を築くための体験的な活動を通して，集団への所属感や連帯感を深め，公共の精神を養いながら，第１の目標に掲げる資質・能力を育成することを目指す。", "lv": 0}, {"id": "82N5203000000000", "n": "内容", "h": "", "t": "１の資質・能力を育成するため，全ての学年において，全校又は学年を単位として，次の各行事において，学校生活に秩序と変化を与え，学校生活の充実と発展に資する体験的な活動を行うことを通して，それぞれの学校行事の意義及び活動を行う上で必要となることについて理解し，主体的に考えて実践できるよう指導する。", "lv": 0}, {"id": "82N5203100000000", "n": "(1)", "h": "儀式的行事", "t": "学校生活に有意義な変化や折り目を付け，厳粛で清新な気分を味わい，新しい生活の展開への動機付けとなるようにすること。", "lv": 1}, {"id": "82N5203200000000", "n": "(2)", "h": "文化的行事", "t": "平素の学習活動の成果を発表し，自己の向上の意欲を一層高めたり，文化や芸術に親しんだりするようにすること。", "lv": 1}, {"id": "82N5203300000000", "n": "(3)", "h": "健康安全・体育的行事", "t": "心身の健全な発達や健康の保持増進，事件や事故，災害等から身を守る安全な行動や規律ある集団行動の体得，運動に親しむ態度の育成，責任感や連帯感の涵養，体力の向上などに資するようにすること。", "lv": 1}, {"id": "82N5203400000000", "n": "(4)", "h": "遠足・集団宿泊的行事", "t": "自然の中での集団宿泊活動などの平素と異なる生活環境にあって，見聞を広め，自然や文化などに親しむとともに，よりよい人間関係を築くなどの集団生活の在り方や公衆道徳などについての体験を積むことができるようにすること。", "lv": 1}, {"id": "82N5203500000000", "n": "(5)", "h": "勤労生産・奉仕的行事", "t": "勤労の尊さや生産の喜びを体得するとともに，ボランティア活動などの社会奉仕の精神を養う体験が得られるようにすること。", "lv": 1}, {"id": "82N5205000000000", "n": "内容の取扱い", "h": "", "t": "", "lv": 0}, {"id": "82N5205100000000", "n": "(1)", "h": "", "t": "児童や学校，地域の実態に応じて，２に示す行事の種類ごとに，行事及びその内容を重点化するとともに，各行事の趣旨を生かした上で，行事間の関連や統合を図るなど精選して実施すること。また，実施に当たっては，自然体験や社会体験などの体験活動を充実するとともに，体験活動を通して気付いたことなどを振り返り，まとめたり，発表し合ったりするなどの事後の活動を充実すること。", "lv": 1}], "keikaku": [{"id": "82N5300100000000", "n": "１", "h": "", "t": "指導計画の作成に当たっては，次の事項に配慮するものとする。", "lv": 0}, {"id": "82N5300110000000", "n": "(1)", "h": "", "t": "特別活動の各活動及び学校行事を見通して，その中で育む資質・能力の育成に向けて，児童の主体的・対話的で深い学びの実現を図るようにすること。その際，よりよい人間関係の形成，よりよい集団生活の構築や社会への参画及び自己実現に資するよう，児童が集団や社会の形成者としての見方・考え方を働かせ，様々な集団活動に自主的，実践的に取り組む中で，互いのよさや個性，多様な考えを認め合い，等しく合意形成に関わり役割を担うようにすることを重視すること。", "lv": 1}, {"id": "82N5300120000000", "n": "(2)", "h": "", "t": "各学校においては特別活動の全体計画や各活動及び学校行事の年間指導計画を作成すること。その際，学校の創意工夫を生かし，学級や学校，地域の実態，児童の発達の段階などを考慮するとともに，第２に示す内容相互及び各教科，道徳科，外国語活動，総合的な学習の時間などの指導との関連を図り，児童による自主的，実践的な活動が助長されるようにすること。また，家庭や地域の人々との連携，社会教育施設等の活用などを工夫すること。", "lv": 1}, {"id": "82N5300130000000", "n": "(3)", "h": "", "t": "学級活動における児童の自発的，自治的な活動を中心として，各活動と学校行事を相互に関連付けながら，個々の児童についての理解を深め，教師と児童，児童相互の信頼関係を育み，学級経営の充実を図ること。その際，特に，いじめの未然防止等を含めた生徒指導との関連を図るようにすること。", "lv": 1}, {"id": "82N53A0140000000", "n": "(4)", "h": "", "t": "低学年においては，第１章総則の第２の４の(1)を踏まえ，他教科等との関連を積極的に図り，指導の効果を高めるようにするとともに，幼稚園教育要領等に示す幼児期の終わりまでに育ってほしい姿との関連を考慮すること。特に，小学校入学当初においては，生活科を中心とした関連的な指導や，弾力的な時間割の設定を行うなどの工夫をすること。", "lv": 1}, {"id": "82N5300150000000", "n": "(5)", "h": "", "t": "障害のある児童などについては，学習活動を行う場合に生じる困難さに応じた指導内容や指導方法の工夫を計画的，組織的に行うこと。", "lv": 1}, {"id": "82N5300160000000", "n": "(6)", "h": "", "t": "第１章総則の第１の２の(2)に示す道徳教育の目標に基づき，道徳科などとの関連を考慮しながら，第３章特別の教科道徳の第２に示す内容について，特別活動の特質に応じて適切な指導をすること。", "lv": 1}, {"id": "82N5300200000000", "n": "２", "h": "", "t": "第２の内容の取扱いについては，次の事項に配慮するものとする。", "lv": 0}, {"id": "82N5300210000000", "n": "(1)", "h": "", "t": "学級活動，児童会活動及びクラブ活動の指導については，指導内容の特質に応じて，教師の適切な指導の下に，児童の自発的，自治的な活動が効果的に展開されるようにすること。その際，よりよい生活を築くために自分たちできまりをつくって守る活動などを充実するよう工夫すること。", "lv": 1}, {"id": "82N5300220000000", "n": "(2)", "h": "", "t": "児童及び学校の実態並びに第１章総則の第６の２に示す道徳教育の重点などを踏まえ，各学年において取り上げる指導内容の重点化を図るとともに，必要に応じて，内容間の関連や統合を図ったり，他の内容を加えたりすることができること。", "lv": 1}, {"id": "82N5300230000000", "n": "(3)", "h": "", "t": "学校生活への適応や人間関係の形成などについては，主に集団の場面で必要な指導や援助を行うガイダンスと，個々の児童の多様な実態を踏まえ，一人一人が抱える課題に個別に対応した指導を行うカウンセリング（教育相談を含む。）の双方の趣旨を踏まえて指導を行うこと。特に入学当初や各学年のはじめにおいては，個々の児童が学校生活に適応するとともに，希望や目標をもって生活できるよう工夫すること。あわせて，児童の家庭との連絡を密にすること。", "lv": 1}, {"id": "82N5300240000000", "n": "(4)", "h": "", "t": "異年齢集団による交流を重視するとともに，幼児，高齢者，障害のある人々などとの交流や対話，障害のある幼児児童生徒との交流及び共同学習の機会を通して，協働することや，他者の役に立ったり社会に貢献したりすることの喜びを得られる活動を充実すること。", "lv": 1}, {"id": "82N5300300000000", "n": "３", "h": "", "t": "入学式や卒業式などにおいては，その意義を踏まえ，国旗を掲揚するとともに，国歌を斉唱するよう指導するものとする。", "lv": 0}]}, "old": {"goal": [{"id": "H20:第1/目標", "n": "目標", "h": "", "t": "望ましい集団活動を通して，心身の調和のとれた発達と個性の伸長を図り，集団の一員としてよりよい生活や人間関係を築こうとする自主的，実践的な態度を育てるとともに，自己の生き方についての考えを深め，自己を生かす能力を養う。", "lv": 0}], "gakkyu": [{"id": "H20:学級活動/1/目標", "n": "目標", "h": "", "t": "学級活動を通して，望ましい人間関係を形成し，集団の一員として学級や学校におけるよりよい生活づくりに参画し，諸問題を解決しようとする自主的，実践的な態度や健全な生活態度を育てる。", "lv": 0}, {"id": "H20:学級活動/2", "n": "内容", "h": "", "t": "", "lv": 0}, {"id": "H20:学級活動/2/第1学年及び第2学年", "n": "1・2年", "h": "", "t": "学級を単位として，仲良く助け合い学級生活を楽しくするとともに，日常の生活や学習に進んで取り組もうとする態度の育成に資する活動を行うこと。", "lv": 2}, {"id": "H20:学級活動/2/第3学年及び第4学年", "n": "3・4年", "h": "", "t": "学級を単位として，協力し合って楽しい学級生活をつくるとともに，日常の生活や学習に意欲的に取り組もうとする態度の育成に資する活動を行うこと。", "lv": 2}, {"id": "H20:学級活動/2/第5学年及び第6学年", "n": "5・6年", "h": "", "t": "学級を単位として，信頼し支え合って楽しく豊かな学級や学校の生活をつくるとともに，日常の生活や学習に自主的に取り組もうとする態度の向上に資する活動を行うこと。", "lv": 2}, {"id": "H20:学級活動/2/共通事項", "n": "共通事項", "h": "", "t": "", "lv": 0}, {"id": "H20:学級活動/2/共通事項/(1)", "n": "(1)", "h": "学級や学校の生活づくり", "t": "", "lv": 1}, {"id": "H20:学級活動/2/共通事項/(1)ア", "n": "ア", "h": "学級や学校における生活上の諸問題の解決", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(1)イ", "n": "イ", "h": "学級内の組織づくりや仕事の分担処理", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(1)ウ", "n": "ウ", "h": "学校における多様な集団の生活の向上", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)", "n": "(2)", "h": "日常の生活や学習への適応及び健康安全", "t": "", "lv": 1}, {"id": "H20:学級活動/2/共通事項/(2)ア", "n": "ア", "h": "希望や目標をもって生きる態度の形成", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)イ", "n": "イ", "h": "基本的な生活習慣の形成", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)ウ", "n": "ウ", "h": "望ましい人間関係の形成", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)エ", "n": "エ", "h": "清掃などの当番活動等の役割と働くことの意義の理解", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)オ", "n": "オ", "h": "学校図書館の利用", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)カ", "n": "カ", "h": "心身ともに健康で安全な生活態度の形成", "t": "", "lv": 2}, {"id": "H20:学級活動/2/共通事項/(2)キ", "n": "キ", "h": "食育の観点を踏まえた学校給食と望ましい食習慣の形成", "t": "", "lv": 2}], "jidokai": [{"id": "H20:児童会活動/1/目標", "n": "目標", "h": "", "t": "児童会活動を通して，望ましい人間関係を形成し，集団の一員としてよりよい学校生活づくりに参画し，協力して諸問題を解決しようとする自主的，実践的な態度を育てる。", "lv": 0}, {"id": "H20:児童会活動/2/柱書", "n": "内容", "h": "", "t": "学校の全児童をもって組織する児童会において，学校生活の充実と向上を図る活動を行うこと。", "lv": 0}, {"id": "H20:児童会活動/2/(1)", "n": "(1)", "h": "児童会の計画や運営", "t": "", "lv": 1}, {"id": "H20:児童会活動/2/(2)", "n": "(2)", "h": "異年齢集団による交流", "t": "", "lv": 1}, {"id": "H20:児童会活動/2/(3)", "n": "(3)", "h": "学校行事への協力", "t": "", "lv": 1}], "club": [{"id": "H20:クラブ活動/1/目標", "n": "目標", "h": "", "t": "クラブ活動を通して，望ましい人間関係を形成し，個性の伸長を図り，集団の一員として協力してよりよいクラブづくりに参画しようとする自主的，実践的な態度を育てる。", "lv": 0}, {"id": "H20:クラブ活動/2/柱書", "n": "内容", "h": "", "t": "学年や学級の所属を離れ，主として第4学年以上の同好の児童をもって組織するクラブにおいて，異年齢集団の交流を深め，共通の興味・関心を追求する活動を行うこと。", "lv": 0}, {"id": "H20:クラブ活動/2/(1)", "n": "(1)", "h": "クラブの計画や運営", "t": "", "lv": 1}, {"id": "H20:クラブ活動/2/(2)", "n": "(2)", "h": "クラブを楽しむ活動", "t": "", "lv": 1}, {"id": "H20:クラブ活動/2/(3)", "n": "(3)", "h": "クラブの成果の発表", "t": "", "lv": 1}], "gyoji": [{"id": "H20:学校行事/1/目標", "n": "目標", "h": "", "t": "学校行事を通して，望ましい人間関係を形成し，集団への所属感や連帯感を深め，公共の精神を養い，協力してよりよい学校生活を築こうとする自主的，実践的な態度を育てる。", "lv": 0}, {"id": "H20:学校行事/2/柱書", "n": "内容", "h": "", "t": "全校又は学年を単位として，学校生活に秩序と変化を与え，学校生活の充実と発展に資する体験的な活動を行うこと。", "lv": 0}, {"id": "H20:学校行事/2/(1)", "n": "(1)", "h": "儀式的行事", "t": "学校生活に有意義な変化や折り目を付け，厳粛で清新な気分を味わい，新しい生活の展開への動機付けとなるような活動を行うこと。", "lv": 1}, {"id": "H20:学校行事/2/(2)", "n": "(2)", "h": "文化的行事", "t": "平素の学習活動の成果を発表し，その向上の意欲を一層高めたり，文化や芸術に親しんだりするような活動を行うこと。", "lv": 1}, {"id": "H20:学校行事/2/(3)", "n": "(3)", "h": "健康安全・体育的行事", "t": "心身の健全な発達や健康の保持増進などについての関心を高め，安全な行動や規律ある集団行動の体得，運動に親しむ態度の育成，責任感や連帯感の涵（かん）養，体力の向上などに資するような活動を行うこと。", "lv": 1}, {"id": "H20:学校行事/2/(4)", "n": "(4)", "h": "遠足・集団宿泊的行事", "t": "自然の中での集団宿泊活動などの平素と異なる生活環境にあって，見聞を広め，自然や文化などに親しむとともに，人間関係などの集団生活の在り方や公衆道徳などについての望ましい体験を積むことができるような活動を行うこと。", "lv": 1}, {"id": "H20:学校行事/2/(5)", "n": "(5)", "h": "勤労生産・奉仕的行事", "t": "勤労の尊さや生産の喜びを体得するとともに，ボランティア活動などの社会奉仕の精神を養う体験が得られるような活動を行うこと。", "lv": 1}], "keikaku": [{"id": "H20:第3/1", "n": "１", "h": "", "t": "指導計画の作成に当たっては，次の事項に配慮するものとする。", "lv": 0}, {"id": "H20:第3/1/(1)", "n": "(1)", "h": "", "t": "特別活動の全体計画や各活動・学校行事の年間指導計画の作成に当たっては，学校の創意工夫を生かすとともに，学級や学校の実態や児童の発達の段階などを考慮し，児童による自主的，実践的な活動が助長されるようにすること。また，各教科，道徳，外国語活動及び総合的な学習の時間などの指導との関連を図るとともに，家庭や地域の人々との連携，社会教育施設等の活用などを工夫すること。", "lv": 1}, {"id": "H20:第3/1/(2)", "n": "(2)", "h": "", "t": "〔学級活動〕などにおいて，児童が自ら現在及び将来の生き方を考えることができるよう工夫すること。", "lv": 1}, {"id": "H20:第3/1/(3)", "n": "(3)", "h": "", "t": "〔クラブ活動〕については，学校や地域の実態等を考慮しつつ児童の興味・関心を踏まえて計画し実施できるようにすること。", "lv": 1}, {"id": "H20:第3/1/(4)", "n": "(4)", "h": "", "t": "第1章総則の第1の2及び第3章道徳の第1に示す道徳教育の目標に基づき，道徳の時間などとの関連を考慮しながら，第3章道徳の第2に示す内容について，特別活動の特質に応じて適切な指導をすること。", "lv": 1}, {"id": "H20:第3/2", "n": "２", "h": "", "t": "第2の内容の取扱いについては，次の事項に配慮するものとする。", "lv": 0}, {"id": "H20:第3/2/(1)", "n": "(1)", "h": "", "t": "〔学級活動〕，〔児童会活動〕及び〔クラブ活動〕の指導については，指導内容の特質に応じて，教師の適切な指導の下に，児童の自発的，自治的な活動が効果的に展開されるようにするとともに，内容相互の関連を図るよう工夫すること。また，よりよい生活を築くために集団としての意見をまとめるなどの話合い活動や自分たちできまりをつくって守る活動，人間関係を形成する力を養う活動などを充実するよう工夫すること。", "lv": 1}, {"id": "H20:第3/2/(2)", "n": "(2)", "h": "", "t": "〔学級活動〕については，学級，学校及び児童の実態，学級集団の育成上の課題や発達の課題及び第3章道徳の第3の1の（3）に示す道徳教育の重点などを踏まえ，各学年段階において取り上げる指導内容の重点化を図るとともに，必要に応じて，内容間の関連や統合を図ったり，他の内容を加えたりすることができること。また，学級経営の充実を図り，個々の児童についての理解を深め，児童との信頼関係を基礎に指導を行うとともに，生徒指導との関連を図るようにすること。", "lv": 1}, {"id": "H20:第3/2/(3)", "n": "(3)", "h": "", "t": "〔児童会活動〕の運営は，主として高学年の児童が行うこと。", "lv": 1}, {"id": "H20:第3/2/(4)", "n": "(4)", "h": "", "t": "〔学校行事〕については，学校や地域及び児童の実態に応じて，各種類ごとに，行事及びその内容を重点化するとともに，行事間の関連や統合を図るなど精選して実施すること。また，実施に当たっては，異年齢集団による交流，幼児，高齢者，障害のある人々などとの触れ合い，自然体験や社会体験などの体験活動を充実するとともに，体験活動を通して気付いたことなどを振り返り，まとめたり，発表し合ったりするなどの活動を充実するよう工夫すること。", "lv": 1}, {"id": "H20:第3/3", "n": "３", "h": "", "t": "入学式や卒業式などにおいては，その意義を踏まえ，国旗を掲揚するとともに，国歌を斉唱するよう指導するものとする。", "lv": 0}]}, "pairs": [{"sec": "goal", "old": ["H20:第1/目標"], "now": ["82N0100000000000"], "kind": "chg", "note": "書き出しが「望ましい集団活動を通して」から「集団や社会の形成者としての見方・考え方を働かせ」に変わった。育てる力は、下の(1)〜(3)に分けて示すようになった。"}, {"sec": "goal", "old": [], "now": ["82N0100100000000", "82N0100200000000", "82N0100300000000"], "kind": "new", "note": "目標を、資質・能力の三つの柱（知識及び技能／思考力，判断力，表現力等／学びに向かう力，人間性等）で示した。(2)の「合意形成」「意思決定」が、特別活動の話合いの2つの柱になった。"}, {"sec": "gakkyu", "old": ["H20:学級活動/1/目標"], "now": ["82N1202000000000"], "kind": "chg", "note": "「望ましい人間関係を形成し」がなくなり、「合意形成」して実践することと、「意思決定」して実践することの2つがはっきり書かれた。"}, {"sec": "gakkyu", "old": [], "now": ["82N1203000000000"], "kind": "new", "note": "内容の書き出しの文が新しく入った。全ての学年で同じ内容を扱い、活動の意義を理解して、主体的に考えて実践できるよう指導する。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(1)"], "now": ["82N1203100000000"], "kind": "chg", "note": "「生活づくり」に「への参画」が付いた。また前回は見出しだけだったア・イ・ウなどに、いまは説明の文が付いている。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(1)ア"], "now": ["82N1203110000000"], "kind": "same", "note": "見出しは同じ。説明の文で「合意形成を図り，実践すること」が示された。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(1)イ"], "now": ["82N1203120000000"], "kind": "chg", "note": "「仕事の分担処理」から「役割の自覚」へ。係などの組織を児童が主体的につくることが示された。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(1)ウ"], "now": ["82N1203130000000"], "kind": "same", "note": "見出しは同じ。児童会や学校行事に向けて「学級としての提案や取組を話し合って決める」と示された。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)"], "now": ["82N1203200000000"], "kind": "chg", "note": "「自己の成長」が加わった。前回の(2)ア〜キは、いまの(2)と(3)に分かれた。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)イ"], "now": ["82N1203210000000"], "kind": "move", "note": "(2)イ → (2)ア。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)ウ"], "now": ["82N1203220000000"], "kind": "move", "note": "(2)ウ → (2)イ。「望ましい人間関係」が「よりよい人間関係」になった。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)カ"], "now": ["82N1203230000000"], "kind": "move", "note": "(2)カ → (2)ウ。説明の文に「事件や事故，災害等から身を守り」が示された。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)キ"], "now": ["82N1203240000000"], "kind": "move", "note": "(2)キ → (2)エ。"}, {"sec": "gakkyu", "old": [], "now": ["82N1203300000000"], "kind": "new", "note": "(3)「一人一人のキャリア形成と自己実現」が新しくできた。中学校・高校の学級活動(ホームルーム活動)の(3)とつながる。前回の(2)ア・エ・オがここへ移った。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)ア"], "now": ["82N1203310000000"], "kind": "move", "note": "(2)ア → (3)ア。「態度」が「意欲や態度」になった。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)エ"], "now": ["82N1203320000000"], "kind": "move", "note": "(2)エ → (3)イ。当番活動に「社会参画意識の醸成」が加わった。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/共通事項/(2)オ"], "now": ["82N1203330000000"], "kind": "move", "note": "(2)オ → (3)ウ。「学校図書館の利用」が「主体的な学習態度の形成と学校図書館等の活用」に広がった。"}, {"sec": "gakkyu", "old": ["H20:学級活動/2/第1学年及び第2学年", "H20:学級活動/2/第3学年及び第4学年", "H20:学級活動/2/第5学年及び第6学年"], "now": ["82N1205100000000", "82N12A5110000000", "82N12C5120000000", "82N12D5130000000"], "kind": "move", "note": "学年ごとの文が「内容」から「内容の取扱い」（配慮すること）へ移った。中身も、話合いと合意形成の姿で書きかわった。"}, {"sec": "gakkyu", "old": [], "now": ["82N1205200000000"], "kind": "new", "note": "(3)の指導で「活動を記録し蓄積する教材等」を使うことが示された（キャリア・パスポート）。"}, {"sec": "jidokai", "old": ["H20:児童会活動/1/目標"], "now": ["82N2202000000000"], "kind": "chg", "note": "「異年齢の児童同士で協力し」が書き出しになり、計画を立て役割を分担して運営することが示された。"}, {"sec": "jidokai", "old": ["H20:児童会活動/2/柱書"], "now": ["82N2203000000000"], "kind": "chg", "note": "内容の書き出しが、学級活動と同じ形にそろった。"}, {"sec": "jidokai", "old": ["H20:児童会活動/2/(1)"], "now": ["82N2203010000000"], "kind": "chg", "note": "「組織づくり」が加わり、説明の文が付いた。"}, {"sec": "jidokai", "old": ["H20:児童会活動/2/(2)"], "now": ["82N2203020000000"], "kind": "same", "note": "見出しは同じ。説明の文が付いた。"}, {"sec": "jidokai", "old": ["H20:児童会活動/2/(3)"], "now": ["82N2203030000000"], "kind": "same", "note": "見出しは同じ。説明の文が付いた。"}, {"sec": "jidokai", "old": ["H20:第3/2/(3)"], "now": ["82N2205100000000"], "kind": "move", "note": "前回は第3にあった文が、児童会活動の「内容の取扱い」へ移った。全児童が主体的に参加できるよう配慮することが加わった。"}, {"sec": "club", "old": ["H20:クラブ活動/1/目標"], "now": ["82N3202000000000"], "kind": "chg", "note": "「異年齢の児童同士で協力し」「共通の興味・関心を追求する」が目標に入った。"}, {"sec": "club", "old": ["H20:クラブ活動/2/柱書"], "now": ["82N3203000000000"], "kind": "chg", "note": "内容の書き出しが、ほかの活動と同じ形にそろった。"}, {"sec": "club", "old": ["H20:クラブ活動/2/(1)"], "now": ["82N3203100000000"], "kind": "chg", "note": "「組織づくり」が加わり、説明の文が付いた。"}, {"sec": "club", "old": ["H20:クラブ活動/2/(2)"], "now": ["82N3203200000000"], "kind": "same", "note": "見出しは同じ。説明の文が付いた。"}, {"sec": "club", "old": ["H20:クラブ活動/2/(3)"], "now": ["82N3203300000000"], "kind": "same", "note": "見出しは同じ。説明の文が付き、「地域の人々」への発表も示された。"}, {"sec": "club", "old": ["H20:第3/1/(3)"], "now": [], "kind": "gone", "note": "クラブ活動を「児童の興味・関心を踏まえて計画し実施できるように」という第3の文は、いまの本文にはない。"}, {"sec": "gyoji", "old": ["H20:学校行事/1/目標"], "now": ["82N5202000000000"], "kind": "chg", "note": "「全校又は学年の児童で協力し」「体験的な活動を通して」が書き出しになった。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/柱書"], "now": ["82N5203000000000"], "kind": "chg", "note": "内容の書き出しが、ほかの活動と同じ形にそろった。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/(1)"], "now": ["82N5203100000000"], "kind": "chg", "note": "「〜ような活動を行うこと」が「〜ようにすること」になった（(2)〜(5)も同じ）。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/(2)"], "now": ["82N5203200000000"], "kind": "chg", "note": "「その向上の意欲」が「自己の向上の意欲」になった。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/(3)"], "now": ["82N5203300000000"], "kind": "chg", "note": "「関心を高め」がなくなり、「事件や事故，災害等から身を守る安全な行動」が入った。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/(4)"], "now": ["82N5203400000000"], "kind": "chg", "note": "「人間関係などの…望ましい体験」が「よりよい人間関係を築くなどの…体験」になった。"}, {"sec": "gyoji", "old": ["H20:学校行事/2/(5)"], "now": ["82N5203500000000"], "kind": "chg", "note": "「ような」がなくなった。中身は同じ。"}, {"sec": "gyoji", "old": ["H20:第3/2/(4)"], "now": ["82N5205100000000"], "kind": "move", "note": "前回は第3にあった文が、学校行事の「内容の取扱い」へ移った。異年齢・幼児・高齢者などとの交流は、いまの第3の2(4)へ分かれた。", "nodiff": true}, {"sec": "keikaku", "old": ["H20:第3/1"], "now": ["82N5300100000000"], "kind": "same", "note": ""}, {"sec": "keikaku", "old": [], "now": ["82N5300110000000"], "kind": "new", "note": "「主体的・対話的で深い学び」の実現と、三つの視点（人間関係の形成・集団生活の構築や社会への参画・自己実現）が示された。"}, {"sec": "keikaku", "old": ["H20:第3/1/(1)"], "now": ["82N5300120000000"], "kind": "chg", "note": "全体計画・年間指導計画の文。「第２に示す内容相互」の関連が加わった。"}, {"sec": "keikaku", "old": [], "now": ["82N5300130000000"], "kind": "new", "note": "学級活動を中心に「学級経営の充実」を図ること（前回は2(2)の後半）に、「いじめの未然防止等を含めた生徒指導」との関連が加わった。"}, {"sec": "keikaku", "old": [], "now": ["82N53A0140000000"], "kind": "new", "note": "低学年で、幼児期の終わりまでに育ってほしい姿との関連と、入学当初の工夫（スタートカリキュラム）が示された。"}, {"sec": "keikaku", "old": [], "now": ["82N5300150000000"], "kind": "new", "note": "障害のある児童などへの指導の工夫が、各教科等と同じく示された。"}, {"sec": "keikaku", "old": ["H20:第3/1/(4)"], "now": ["82N5300160000000"], "kind": "chg", "note": "「道徳」が「特別の教科　道徳（道徳科）」になったことに合わせた書きかえ。"}, {"sec": "keikaku", "old": ["H20:第3/1/(2)"], "now": [], "kind": "gone", "note": "「現在及び将来の生き方を考える」工夫は、学級活動の内容(3)「一人一人のキャリア形成と自己実現」として内容に入った。"}, {"sec": "keikaku", "old": ["H20:第3/2"], "now": ["82N5300200000000"], "kind": "same", "note": ""}, {"sec": "keikaku", "old": ["H20:第3/2/(1)"], "now": ["82N5300210000000"], "kind": "chg", "note": "「話合い活動」「人間関係を形成する力を養う活動」の文がなくなり、「きまりをつくって守る活動」が残った。話合いは目標や内容の「合意形成」「意思決定」で示された。"}, {"sec": "keikaku", "old": ["H20:第3/2/(2)"], "now": ["82N5300220000000"], "kind": "chg", "note": "学級活動だけでなく、各学年の指導内容の重点化として示された。学級経営の部分は1(3)へ移った。", "nodiff": true}, {"sec": "keikaku", "old": [], "now": ["82N5300230000000"], "kind": "new", "note": "「ガイダンス」と「カウンセリング（教育相談を含む）」の双方の趣旨を踏まえて指導することが示された。"}, {"sec": "keikaku", "old": ["H20:第3/2/(4)"], "now": ["82N5300240000000"], "kind": "move", "note": "前回は学校行事の扱いの中にあった交流を、特別活動全体の配慮として示した。障害のある幼児児童生徒との交流及び共同学習も加わった。", "nodiff": true}, {"sec": "keikaku", "old": ["H20:第3/3"], "now": ["82N5300300000000"], "kind": "same", "note": ""}], "terms": [{"w": "見方・考え方", "yomi": "みかた・かんがえかた", "m": ["見方・考え方"], "t": "特別活動では「集団や社会の形成者としての見方・考え方」。各教科等で働かせる見方・考え方を総合的に働かせながら、自分や集団・社会の問題をとらえ、よりよい人間関係の形成、よりよい集団生活の構築や社会への参画、自己の実現と関連付けること。", "tag": "平成29年から", "rel": ["三つの視点", "望ましい集団活動"]}, {"w": "三つの視点", "yomi": "みっつのしてん", "m": ["人間関係形成", "社会参画", "自己実現"], "t": "「人間関係形成」「社会参画」「自己実現」。平成29年の改訂で、特別活動で育てる資質・能力を整理するために示された視点。本文では、第3の1(1)に「よりよい人間関係の形成，よりよい集団生活の構築や社会への参画及び自己実現」と書かれている。", "tag": "平成29年から", "rel": ["見方・考え方", "キャリア形成"]}, {"w": "合意形成", "yomi": "ごういけいせい", "m": ["合意形成"], "t": "話合いを通して、集団としての考えを一つにまとめること。多数決だけに頼らず、互いの意見のよさを生かし、少数の意見も大切にしながら折り合いをつける。主に学級活動(1)・児童会活動・クラブ活動で行う。「みんなで決める」話合い。", "rel": ["意思決定", "学級会", "話合い活動"]}, {"w": "意思決定", "yomi": "いしけってい", "m": ["意思決定"], "t": "話合いや集めた情報をもとに、一人一人が自分の目標や行動を決めること。主に学級活動(2)(3)で行う。「自分で決める」話合い。決めたことを実践し、振り返るところまでが一つの流れ。", "rel": ["合意形成", "キャリア・パスポート"]}, {"w": "話合い活動", "yomi": "はなしあいかつどう", "m": ["話合い", "話し合い"], "t": "特別活動の中心となる活動。学級活動(1)では集団としての合意形成のために、(2)(3)では一人一人の意思決定のために話し合う。前回（平成20年）は第3に「話合い活動」の充実が書かれていたが、いまは目標と内容の中で示されている。", "rel": ["合意形成", "意思決定", "学級会"]}, {"w": "学級会", "yomi": "がっきゅうかい", "t": "学級活動(1)の話合いを、多くの学校でこう呼ぶ。計画委員会（司会グループ）を中心に、議題を集めて決め、提案理由をもとに話し合い、決めたことを実践して振り返る。", "note": "本文には出てこない語。解説や国の指導資料で使われている。", "tag": "本文にない語", "rel": ["合意形成", "自発的，自治的な活動"]}, {"w": "自発的，自治的な活動", "yomi": "じはつてき・じちてきなかつどう", "m": ["自発的，自治的な活動"], "t": "児童が自分たちで問題を見つけ、話し合って決め、協力して実践する活動。教師の適切な指導の下で行う。学級活動(1)・児童会活動・クラブ活動の特質。", "rel": ["自主的，実践的", "学級会"]}, {"w": "自主的，実践的", "yomi": "じしゅてき・じっせんてき", "m": ["自主的，実践的"], "t": "特別活動の目標の中心にある言葉。児童が自分から進んで、実際の集団活動を通して学ぶこと。全ての活動と学校行事に共通する。", "rel": ["なすことによって学ぶ", "自発的，自治的な活動"]}, {"w": "なすことによって学ぶ", "yomi": "なすことによってまなぶ", "t": "特別活動の学び方の原理を表す言葉。実際に集団活動を行い、その中で考え、話し合い、振り返ることで学ぶ。", "note": "本文には出てこない語。解説で示されている。", "tag": "本文にない語", "rel": ["自主的，実践的"]}, {"w": "キャリア形成", "yomi": "きゃりあけいせい", "m": ["キャリア形成"], "t": "社会の中で自分の役割を果たしながら、自分らしい生き方を実現していくこと。平成29年に学級活動の内容(3)「一人一人のキャリア形成と自己実現」として新しく入った。総則では、特別活動を要としてキャリア教育の充実を図ることが示されている。", "tag": "平成29年から", "rel": ["キャリア・パスポート", "三つの視点"]}, {"w": "キャリア・パスポート", "yomi": "きゃりあ・ぱすぽーと", "m": ["記録し蓄積する教材"], "t": "本文の「児童が活動を記録し蓄積する教材等」にあたるもの。学級活動(3)を中心に、学校・家庭・地域での学びの見通しと振り返りを記録し、小学校から高校までつないで使う。令和2年度（2020年度）から全国の小・中・高で始まった。", "note": "「キャリア・パスポート」という名前は本文にはなく、文部科学省の通知・例示資料で使われている。", "tag": "平成29年から", "rel": ["キャリア形成", "意思決定"]}, {"w": "ガイダンスとカウンセリング", "yomi": "がいだんすとかうんせりんぐ", "m": ["ガイダンス", "カウンセリング"], "t": "ガイダンスは、主に集団の場面で、必要な情報を伝えたり見通しをもたせたりする指導や援助。カウンセリングは、一人一人が抱える課題に個別に対応する指導（教育相談を含む）。入学当初や各学年のはじめに特に大切にする。", "tag": "平成29年から", "rel": ["学級経営", "生徒指導"]}, {"w": "異年齢集団", "yomi": "いねんれいしゅうだん", "m": ["異年齢集団", "異年齢の児童"], "t": "学年のちがう児童でつくる集団。児童会活動・クラブ活動・たてわり班の活動などで、上の学年が下の学年を思いやり、下の学年が上の学年にあこがれる関係を育てる。", "rel": ["自発的，自治的な活動"]}, {"w": "当番活動と係活動", "yomi": "とうばんかつどうとかかりかつどう", "m": ["当番活動", "係活動"], "t": "当番活動は、給食・清掃など学級の生活に欠かせない仕事を、全員が交代で受け持つもの。係活動は、学級の生活を楽しく豊かにするために、児童が工夫して自分たちでつくり、行うもの。", "rel": ["自発的，自治的な活動", "キャリア形成"]}, {"w": "学級経営", "yomi": "がっきゅうけいえい", "m": ["学級経営"], "t": "学級を単位に、児童一人一人の成長と、よりよい集団づくりを図る教師の営み。第3の1(3)で、学級活動における自発的，自治的な活動を中心に、学級経営の充実を図ることが示されている。", "rel": ["生徒指導", "ガイダンスとカウンセリング"]}, {"w": "生徒指導", "yomi": "せいとしどう", "m": ["生徒指導", "いじめの未然防止"], "t": "児童一人一人の個性を伸ばし、社会の中で自分らしく生きる力を育てる指導（小学校でもこの名前を使う）。平成29年に、特別活動の指導計画で「いじめの未然防止等を含めた生徒指導との関連」が示された。", "rel": ["学級経営"]}, {"w": "望ましい集団活動", "yomi": "のぞましいしゅうだんかつどう", "m": ["望ましい集団活動"], "t": "平成20年までの特別活動の目標の書き出し。「望ましい集団活動を通して」。平成29年からは「集団や社会の形成者としての見方・考え方を働かせ」に書きかわった。", "tag": "前回まで", "rel": ["見方・考え方"]}, {"w": "幼児期の終わりまでに育ってほしい姿", "yomi": "ようじきのおわりまでにそだってほしいすがた", "m": ["幼児期の終わりまでに育ってほしい姿"], "t": "幼稚園教育要領などに示された10の姿（健康な心と体、自立心、協同性 など）。小学校入学当初は、これを踏まえ、生活科を中心に他教科等と関連させた指導（スタートカリキュラム）を工夫する。", "tag": "平成29年から"}, {"w": "重点化・精選", "yomi": "じゅうてんか・せいせん", "m": ["重点化", "精選"], "t": "学校行事を、児童・学校・地域の実態に合わせて、種類ごとに重点をしぼり、行事どうしを関連・統合して整理すること。学級活動の指導内容でも、学年ごとに重点化を図る。"}, {"w": "食育", "yomi": "しょくいく", "m": ["食育"], "t": "給食の時間を中心に、健康によい食事のとり方や、食事を通してよりよい人間関係をつくることを学ぶ。学級活動(2)エ。"}, {"w": "授業時数", "yomi": "じゅぎょうじすう", "t": "学級活動は年間35単位時間（1年は34単位時間）。学校教育法施行規則の別表で、特別活動の時数は学級活動（給食に係るものを除く）に充てるとされている。児童会活動・クラブ活動・学校行事は、内容に応じて年間や月ごとなど、内容に応じて学校が適切な時数を充てる（総則）。", "note": "本文（第６章）には書かれていない。", "tag": "本文にない語"}], "hist": [{"year": "1947", "when": "昭和22年試案 → 1947年度から", "name": "自由研究（教科の一つ）", "parts": ["教科の学習の発展としての自由な学習", "クラブ組織による活動", "当番や学級委員の仕事"], "points": ["小学校4〜6年に置き、各学年70〜140時間（週2〜4時間）", "1〜3年にはない"], "src": "学習指導要領一般編（試案）昭和22年度 第三章（国立教育政策研究所データベース）", "url": "https://erid.nier.go.jp/files/COFS/s22ej/chap3.htm"}, {"year": "1951", "when": "昭和26年試案", "name": "教科以外の活動", "parts": ["児童全体の集会", "児童の委員会", "遠足・学芸会・展覧会・音楽会", "自由な読書", "クラブ活動"], "points": ["自由研究をなくし、教科以外の活動の時間を設けた", "教科以外の活動だけの時数は示されていない"], "src": "学習指導要領一般編（試案）（抄）昭和26年（文部科学省）", "url": "https://www.mext.go.jp/b_menu/hakusho/html/others/detail/1318004.htm"}, {"year": "1958", "when": "昭和33年告示 → 1961年度から", "name": "特別教育活動／学校行事等", "parts": ["特別教育活動：児童会活動・学級会活動・クラブ活動", "学校行事等：儀式・学芸的行事・保健体育的行事・遠足・学校給食その他"], "points": ["初めて告示になり、教育課程の基準としての性格がはっきりした", "特別教育活動は子どもの自発的・自治的な活動が中心", "クラブ活動は主に中学年以上", "学級会活動に毎週一定の時間をあてるのが望ましい"], "src": "国立教育政策研究所「12 特別活動」（答申・学習指導要領の資料集）／学習指導要領 昭和33年 第3章（国立教育政策研究所データベース）／文部科学省「学習指導要領の変遷」", "url": "https://erid.nier.go.jp/files/COFS/s33e/chap3-2.htm"}, {"year": "1968", "when": "昭和43年告示 → 1971年度から", "name": "特別活動", "parts": ["児童活動：児童会活動・学級会活動・クラブ活動", "学校行事：儀式・学芸的行事・保健体育的行事・遠足的行事・安全指導的行事", "学級指導"], "points": ["特別教育活動と学校行事等をまとめ、「特別活動」ができた", "クラブ活動は主に4年生以上で組織し、学級会活動とクラブ活動に毎週1単位時間が望ましい"], "src": "国立教育政策研究所「12 特別活動」（答申・学習指導要領の資料集）／学習指導要領 昭和43年 第4章", "url": "https://erid.nier.go.jp/files/COFS/s43e/chap4.htm"}, {"year": "1977", "when": "昭和52年告示 → 1980年度から", "name": "特別活動", "parts": ["児童活動：学級会活動・児童会活動・クラブ活動", "学校行事：儀式的・学芸的・体育的・遠足旅行的・保健安全的・勤労生産的行事", "学級指導"], "points": ["基本の性格は前と同じ", "学校行事に「勤労・生産的行事」が入った", "時数は学校が実態に応じて決める"], "src": "国立教育政策研究所「12 特別活動」（答申・学習指導要領の資料集）／学習指導要領 昭和52年 第4章", "url": "https://erid.nier.go.jp/files/COFS/s52e/chap4.htm"}, {"year": "1989", "when": "平成元年告示 → 1992年度から", "name": "特別活動", "parts": ["学級活動", "児童会活動", "クラブ活動", "学校行事：儀式的・学芸的・健康安全体育的・遠足集団宿泊的・勤労生産奉仕的行事"], "points": ["学級会活動と学級指導を合わせて「学級活動」ができた", "今と同じ4つの内容の形になった", "学級活動とクラブ活動は年35週（1年は34週）以上にわたって計画"], "src": "国立教育政策研究所「12 特別活動」（答申・学習指導要領の資料集）／学習指導要領 平成元年 第1章・第4章", "url": "https://erid.nier.go.jp/files/COFS/h01e/chap4.htm"}, {"year": "1998", "when": "平成10年告示 → 2002年度から", "name": "特別活動", "parts": ["学級活動", "児童会活動", "クラブ活動", "学校行事"], "points": ["4つの構成はそのまま", "クラブ活動は児童会活動・学校行事と同じく「学校で適切な授業時数を充てる」扱いになった"], "src": "国立教育政策研究所「12 特別活動」（答申・学習指導要領の資料集）／学習指導要領 平成10年 第1章", "url": "https://erid.nier.go.jp/files/COFS/h10e/chap1.htm"}, {"year": "2008", "when": "平成20年告示 → 2011年度から", "name": "特別活動", "parts": ["学級活動：(1)学級や学校の生活づくり (2)日常の生活や学習への適応及び健康安全", "児童会活動", "クラブ活動", "学校行事（「学芸的行事」が「文化的行事」に）"], "points": ["目標に「人間関係」を加え、各活動・学校行事ごとの目標を新しく示した", "学級活動の内容を低・中・高学年ごとに示した", "児童会活動・クラブ活動の内容を具体的に示した"], "src": "小学校学習指導要領解説 特別活動編（平成20年8月）／文部科学省「学習指導要領の変遷」", "url": "https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2009/06/16/1234931_014.pdf", "cmp": true}, {"year": "2017", "when": "平成29年告示 → 2020年度から", "name": "特別活動", "parts": ["学級活動：(1)生活づくりへの参画 (2)日常の生活や学習への適応と自己の成長及び健康安全 (3)一人一人のキャリア形成と自己実現", "児童会活動", "クラブ活動", "学校行事"], "points": ["目標を「人間関係形成・社会参画・自己実現」の三つの視点と資質・能力の三つの柱で整理した", "「望ましい集団活動を通して」を学習の過程として具体的に示した", "小学校の学級活動に(3)キャリア形成と自己実現を新設", "子どもが活動を記録し蓄積する教材等（キャリア・パスポート）を使う", "学級活動の内容は学年共通で示し、学年段階ごとの配慮事項を示した"], "src": "小学校学習指導要領（平成29年告示）解説 特別活動編", "url": "https://www.mext.go.jp/content/20221213-mxt_kyoiku02-100002607_014.pdf", "now": true}, {"year": "次", "when": "2030年度から（想定）", "next": true, "name": "次の学習指導要領（いま審議中）", "parts": ["学級活動：(1)生活の創造 (2)自己の成長と健康安全 (3)将来に向けた自己の成長とキャリア形成（案）", "児童会活動", "クラブ活動", "学校行事"], "points": ["三つの視点の「社会参画」を「社会創造」に言いかえる案", "学級活動を「学級経営の要」とはっきり書く案", "児童会活動で、学校のきまりなどを提案し先生と話し合う（意見表明）案", "キャリア・パスポートの国の例示資料をやめ、子ども本人が記録を持つ形にする案", "くわしくは「次の改訂」へ"], "src": "中教審 特別活動ワーキンググループ取りまとめ（案）2026-08-04・教育課程部会 審議まとめ 2026-10-05", "url": "https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/004/gaiyou/1292164_00001.htm"}], "next": {"asof": "2026年11月3日", "status": "2026年10月5日に中教審の教育課程部会が「次期学習指導要領等に向けた審議まとめ」をまとめ、今は意見募集（11月5日まで）の段階。答申と告示はまだで、日付は一次資料では未確認。小学校の全面実施は2030年度の想定で、特別活動の改訂の方向はまだ「審議中の案」。", "steps": [{"d": "2024年12月", "t": "中教審へ諮問"}, {"d": "2025年9月", "t": "論点整理"}, {"d": "2025年10月〜2026年6月", "t": "特別活動ワーキンググループ"}, {"d": "2026年10月", "t": "審議まとめ・意見募集", "now": true}, {"d": "これから", "t": "答申・告示（日付は未定）"}, {"d": "2028年度〜", "t": "先行実施（案）"}, {"d": "2030年度", "t": "小学校で全面実施（想定）"}], "items": [{"t": "文部科学大臣が中教審に、次の学習指導要領について諮問した。", "kind": "決定", "date": "2024-12-25", "src": "諮問「初等中等教育における教育課程の基準等の在り方について」", "url": "https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo0/toushin/mext_00003.html"}, {"t": "教育課程企画特別部会が「論点整理」をまとめた（特別活動を、民主主義の担い手を育て共生社会を実現する土台と位置付ける、内容の精選を進める、など）。", "kind": "決定", "date": "2025-09-25", "src": "教育課程企画特別部会 論点整理（ポイント資料）", "url": "https://www.mext.go.jp/content/20260202-mxt-kyoiku-000047088_10.pdf"}, {"t": "特別活動ワーキンググループが審議した（第1回 2025-10-20、第3回 2025-12-15 ～ 第7回 2026-06-23）。第7回で取りまとめ案を大筋了承し、2026-08-04付で会議後修正版を公表。", "kind": "決定", "date": "2026-08-04", "src": "特別活動ワーキンググループ 開催状況", "url": "https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/116/index.html"}, {"t": "「審議まとめ（素案）」が教育課程企画特別部会に出された。", "kind": "決定", "date": "2026-08-31", "src": "審議まとめ（素案）", "url": "https://www.mext.go.jp/content/20260831-mxt_kyoiku01-000051893-3.pdf"}, {"t": "教育課程部会が「次期学習指導要領等に向けた審議まとめ」をまとめた。WGの特別活動の案は、ほぼそのまま第2部「特別活動」に入っている。", "kind": "決定", "date": "2026-10-05", "src": "次期学習指導要領等に向けた審議まとめ（公表ページ）", "url": "https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/004/gaiyou/1292164_00001.htm"}, {"t": "審議まとめへの意見募集（パブリック・コメント）は 2026-10-06 ～ 11-05。今は募集中。", "kind": "予定", "date": "2026-10-06", "src": "文部科学省 報道発表", "url": "https://www.mext.go.jp/b_menu/houdou/mext_01690.html"}, {"t": "答申・告示の日付は、一次資料では未確認（2025年夏ごろの資料では「令和8年度中の答申」を前提、報道では今年度中に改訂の見込み）。", "kind": "予定", "date": "未確認", "src": "未確認（一次資料で日付の明記を見つけられず）", "url": ""}, {"t": "全面実施は小学校が令和12年度（2030年度）、中学校が令和13年度（2031年度）を想定。", "kind": "予定", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "令和10年度（2028年度）から先行実施の期間とし、調整授業時数制度などを先に使えるようにする方向。", "kind": "審議中の案", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "1年間の標準の総授業時数は今と同じに保つ。", "kind": "審議中の案", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "「調整授業時数制度」を作る。学校の判断で各教科等の時数を減らし（最大で小138コマ程度）、ほかの教科や「裁量的な時間」に回せる。国への申請は不要にする方向。", "kind": "審議中の案", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "標準が35コマ以下の教科等は減らせない（学級活動はこれに当たる）。また、回した時数を学校行事・クラブ活動など標準の決まっていない特別活動に上乗せすることはできない。", "kind": "審議中の案", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "「裁量的な時間」でいじめ防止・安全などを行うときは、特別活動と役割を分ける。子どもの発議で年度の途中に決まった活動に、裁量的な時間を使うやり方は今後くわしく検討。学校行事の時数を裁量的な時間で置きかえる使い方はしない。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "「デジタル学習指導要領」を作る（ウェブで提供、検索、学年・教科のつながりが見える、AIが読みやすい形、学習指導要領コード）。細かな機能は文部科学省が検討。", "kind": "審議中の案", "date": "2026-10-05", "src": "中教審 教育課程部会「次期学習指導要領等に向けた審議まとめ」（第1・2部）", "url": "https://www.mext.go.jp/content/20261005-mxt_kyoiku01-000052360-1.pdf"}, {"t": "特別活動の「三つの視点」を見直し、「社会参画」を「社会創造」に言いかえる（人間関係形成・社会創造・自己実現）。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "学級活動は「学級経営の要」であることをはっきり書く。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "学級活動の項目名を見直す：(1)学級や学校における生活の創造、(2)日常生活における自己の成長と健康安全、(3)将来に向けた自己の成長とキャリア形成。(1)はア＝学級内の課題、イ＝学級内の組織や役割、ウ＝学級を越えた学校の課題、と分ける。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "学級活動(1)ウで学校の課題を話し合うとき、学級での話合いを原則としつつ、学年や異学年での話合いも判断で行えるようにする。(2)ではSOSの出し方の教育・生命の安全教育などをはっきり位置付ける。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "児童会活動の「学校行事への協力」を見直し、子どもが学校のきまりなどについて提案し、先生と話し合って学校運営に関わる（意見表明）ことを内容に書く。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "クラブ活動の意義を「好きの追求による個性の伸長」とする。学年（主に4年生以上）や活動の形をより柔軟にし、特定の期間に集中して行う、地域の団体が担う、なども認める方向。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "学校行事は「子どもたちが創造する活動」であることをはっきりさせる（安全、先生の負担に配慮）。「文化的行事」を「文化・学習発表的行事（仮称）」にする。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "総合的な学習の時間で学校行事を代わりにできる場合をはっきりさせる：儀式的行事と、文化的行事・健康安全・体育的行事の準備（学習発表会を除く）は代替しないのが原則。遠足・集団宿泊的行事などは探究になる部分だけ代替できる。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "キャリア・パスポートは、国の「例示資料」をやめ、学校に合ったいろいろな見通し・振り返りの取組に変える。記録はクラウドなどで子ども本人が持つことを基本とし、学校どうしの引き継ぎは求めない。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "評価は、過度な評価材料集めを求めない形に見直す。合意形成・意思決定の考え方を整理し、AIを含むデジタルの使い方も示す。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}, {"t": "特別活動の英語名を「Tokkatsu (Student-Led Activities for Civic and Personal Development)」と定める。", "kind": "審議中の案", "date": "2026-08-04", "src": "特別活動ワーキンググループ取りまとめ（案）会議後修正", "url": "https://www.mext.go.jp/content/20260804-mxt_kyoiku01-000051401_1-1.pdf"}]}, "src_extra": "歩み・次の改訂・用語は、文部科学省・中央教育審議会・国立教育政策研究所の資料をもとに まとめたもの", "histfig": {"cols": ["1947", "1951", "1958", "1968", "1977", "1989", "1998", "2008", "2017", "次"], "lanes": [{"n": "名前", "seg": [["1947", "1947", "自由研究"], ["1951", "1951", "教科以外の活動"], ["1958", "1958", "特別教育活動"], ["1968", "1977", "特別活動（児童活動・学級指導・学校行事）"], ["1989", "2017", "特別活動（4つの内容）"], ["次", "次", "特別活動（案）"]]}, {"n": "学級", "seg": [["1947", "1947", "当番・学級委員の仕事"], ["1951", "1951", ""], ["1958", "1958", "学級会活動"], ["1968", "1977", "学級会活動＋学級指導"], ["1989", "1998", "学級活動 ができる"], ["2008", "2008", "(1)(2)と学年別の文"], ["2017", "2017", "(3)キャリア形成 ができる"], ["次", "次", "学級経営の要（案）"]]}, {"n": "児童会", "seg": [["1947", "1947", ""], ["1951", "1951", "児童の委員会・集会"], ["1958", "1998", "児童会活動"], ["2008", "2017", "児童会活動（内容(1)〜(3)）"], ["次", "次", "学校運営への意見表明（案）"]]}, {"n": "クラブ", "seg": [["1947", "1947", "クラブ組織の活動"], ["1951", "1951", "クラブ活動"], ["1958", "1958", "主に中学年以上"], ["1968", "1989", "主に4年生以上"], ["1998", "2017", "時数は学校で決める"], ["次", "次", "「好き」の追求（案）"]]}, {"n": "学校行事", "seg": [["1947", "1947", ""], ["1951", "1951", "遠足・学芸会など"], ["1958", "1958", "学校行事等（別の枠）"], ["1968", "1968", "特別活動に入る"], ["1977", "1977", "勤労・生産的行事 が入る"], ["1989", "1998", "5種類の行事"], ["2008", "2017", "学芸的→文化的行事"], ["次", "次", "文化・学習発表的行事（案）"]]}]}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('tk-data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const SEC={};D.secs.forEach(s=>SEC[s.id]=s.n);
const NOW={},OLD={};
D.secs.forEach(s=>{D.now[s.id].forEach(r=>{r.sec=s.id;NOW[r.id]=r;});D.old[s.id].forEach(r=>{r.sec=s.id;OLD[r.id]=r;});});
// いまの項目 → くらべの対応
const PAIR={};D.pairs.forEach((p,i)=>{p.i=i;(p.now||[]).forEach(c=>PAIR[c]=p);});
const KIND={new:'新しく入った',chg:'書きかえ',move:'場所が移った',same:'ほぼ同じ',gone:'前回だけ'};
const NK={'決定':'kettei','審議中の案':'shingi','予定':'yotei'};
const S={fig:true,mode:'now',sec:'gakkyu',year:'',term:0,q:'',pick:[],hit:'',mark:true,onlyChg:false,card:-1};
try{const o=JSON.parse(localStorage.getItem('tk-state')||'{}');['mode','sec','term','mark','onlyChg','fig'].forEach(k=>{if(o[k]!=null)S[k]=o[k];});}catch(e){}
function save(){try{localStorage.setItem('tk-state',JSON.stringify({mode:S.mode,sec:S.sec,term:S.term,mark:S.mark,onlyChg:S.onlyChg,fig:S.fig}));}catch(e){}}

/* 用語の下線：長い語から先に当てる。1項目の中で同じ語は最初の1回だけ */
const TW=[];D.terms.forEach((t,i)=>(t.m||[t.w]).forEach(w=>TW.push([w,i])));TW.sort((a,b)=>b[0].length-a[0].length);
const TRE=new RegExp('('+TW.map(x=>reEsc(x[0])).join('|')+')','g');
function deco(t,words){
 // 用語の下線と さがす語の印を、エスケープした字に付ける
 let h=esc(t);
 if(words){const seen={};h=h.replace(TRE,w=>{const i=TW.find(x=>x[0]===w)[1];if(seen[i])return w;seen[i]=1;return '<a href="#" class="tk-w" data-t="'+i+'">'+w+'</a>';});}
 if(S.q){const q=reEsc(esc(S.q));h=h.replace(new RegExp('(^|>)([^<]*)','g'),(m,a,b)=>a+b.replace(new RegExp(q,'g'),'<mark>$&</mark>'));}
 return h;
}
const label=r=>SEC[r.sec]+(r.n&&r.n!==SEC[r.sec]?' '+r.n:'')+(r.h?' '+r.h:'');
/* 文字のちがい（LCS）：短すぎる「同じ」は前後にまとめて、印を読みやすくする */
function diff(a,b){
 const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let ops=[],i=0,j=0;const push=(k,c)=>{const l=ops[ops.length-1];if(l&&l[0]===k)l[1]+=c;else ops.push([k,c]);};
 while(i<n&&j<m){if(a[i]===b[j]){push('=',a[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){push('-',a[i]);i++;}else{push('+',b[j]);j++;}}
 while(i<n)push('-',a[i++]);while(j<m)push('+',b[j++]);
 for(let k=1;k<ops.length-1;k++)if(ops[k][0]==='='&&ops[k][1].length<3){ops.splice(k,1,['-',ops[k][1]],['+',ops[k][1]]);}
 const A=[],B=[];ops.forEach(([k,c])=>{if(k!=='+')A.push([k,c]);if(k!=='-')B.push([k,c]);});
 const join=(x,tag)=>{let o=[];x.forEach(([k,c])=>{const l=o[o.length-1];if(l&&l[0]===k)l[1]+=c;else o.push([k,c]);});return o.map(([k,c])=>k==='='?esc(c):'<'+tag+'>'+esc(c)+'</'+tag+'>').join('');};
 return [join(A,'del'),join(B,'ins')];
}
const full=r=>(r.h?r.h+'\n':'')+r.t;

/* ---------- いまの本文 ---------- */
function rowHTML(r){
 const p=PAIR[r.id],on=S.pick.includes(r.id);
 const tag=p&&p.kind!=='same'?'<span class="tk-tag '+p.kind+'">'+(p.kind==='new'?'新':KIND[p.kind])+'</span>':'';
 const cmp=p?'<a href="#" class="tk-cmp" data-p="'+p.i+'">前回は →</a>':'';
 const head=(r.n?'<span class="tk-n">'+esc(r.n)+'</span>':'')+(r.h?'<span class="tk-h">'+deco(r.h,1)+'</span>':'');
 return '<div class="tk-r l'+r.lv+(on?' on':'')+(S.hit===r.id?' hit':'')+'" id="r'+r.id+'"><div>'+head+tag+cmp+(r.t?'<span class="tk-t">'+deco(r.t,1)+'</span>':'')+'</div>'
  +(r.t||(r.h&&r.lv)?'<button class="tk-ck" data-c="'+r.id+'" aria-pressed="'+on+'" aria-label="選ぶ"><i></i></button>':'<span></span>')+'</div>';
}
function navSecs(){
 $('tk-nav').innerHTML=D.secs.map(s=>'<button data-s="'+s.id+'" aria-pressed="'+(!S.q&&S.sec===s.id)+'">'+(s.id==='keikaku'?'指導計画<span class="tk-lg">の作成と内容の取扱い</span>':s.n)+'</button>').join('');
}
function renderNow(){
 navSecs();
 $('tk-ttl').innerHTML='<b>'+SEC[S.sec]+'</b><span>平成29年告示（令和2年度から）</span>';
 $('tk-list').innerHTML=D.now[S.sec].map(rowHTML).join('');
}
/* ---------- 前回とくらべる ---------- */
function renderCmp(){
 navSecs();
 $('tk-ttl').innerHTML='<b>'+SEC[S.sec]+'</b><span>前回 平成20年 → いま 平成29年</span><span class="tk-sp"></span>'
  +'<button id="tk-mark" aria-pressed="'+S.mark+'">ちがいに印</button><button id="tk-only" aria-pressed="'+S.onlyChg+'">変わった所だけ</button>';
 const ps=D.pairs.filter(p=>p.sec===S.sec&&!(S.onlyChg&&p.kind==='same'));
 let h='<div class="tk-cmpg"><div class="tk-colh">前回（平成20年告示）</div><div class="tk-colh">いま（平成29年告示）</div>';
 ps.forEach(p=>{
  const o=(p.old||[]).map(i=>OLD[i]),n=(p.now||[]).map(i=>NOW[i]);
  let L,R;
  if(S.mark&&!p.nodiff&&p.kind!=='new'&&p.kind!=='gone'&&o.length===1&&n.length===1){const d=diff(full(o[0]),full(n[0]));L=d[0].replace(/\n/g,'<br>');R=d[1].replace(/\n/g,'<br>');
   L=(o[0].n?'<span class="tk-n">'+esc(o[0].n)+'</span>':'')+L;R=(n[0].n?'<span class="tk-n">'+esc(n[0].n)+'</span>':'')+R;}
  else{const f=rs=>rs.map(r=>(r.n?'<span class="tk-n">'+esc(r.n)+'</span>':'')+(r.h?'<span class="tk-h">'+esc(r.h)+'</span><br>':'')+esc(r.t)).join('<br>');
   L=o.length?f(o):'<span class="tk-x">（前回は なし）</span>';R=n.length?f(n):'<span class="tk-x">（いまは なし）</span>';}
  h+='<div class="tk-note" id="p'+p.i+'"'+(S.hit==='p'+p.i?' style="outline:3px solid #b8860b;outline-offset:-3px"':'')+'><span class="tk-tag '+p.kind+'" style="margin:0 8px 0 0">'+KIND[p.kind]+'</span>'+deco(p.note||'',1)+'</div><div class="o">'+L+'</div><div class="n">'+R+'</div>';
 });
 $('tk-list').innerHTML=h+'</div>'+(ps.length?'':'<div class="tk-none">変わった所は ありません</div>');
}
/* ---------- 歩み ---------- */
function renderHist(){
 $('tk-nav').innerHTML=D.hist.map((y,i)=>'<button data-y="'+i+'"'+(y.now?' aria-current="true"':'')+'>'+esc(y.year)+'<small>'+esc(y.name)+'</small></button>').join('');
 $('tk-ttl').innerHTML='<b>特別活動の 歩み</b><span>'+(S.fig?'帯が切れた所で 名前や形が変わった':'告示した年 → 小学校で始まった年')+'</span><span class="tk-sp"></span><div class="tk-seg"><button id="tk-fig1" aria-pressed="'+S.fig+'">図で見る</button><button id="tk-fig0" aria-pressed="'+!S.fig+'">文で見る</button></div>';
 if(S.fig){$('tk-list').innerHTML=figHTML()+figHTMLv();return;}
 $('tk-list').innerHTML=D.hist.map((y,i)=>'<div class="tk-y'+(y.now?' now':'')+(y.next?' next':'')+'" id="y'+i+'"><div class="yy">'+esc(y.year)+'<small>'+esc(y.when)+'</small>'+(y.now?'<span class="tk-tag chg" style="margin:4px 0 0">いま</span>':'')+(y.next?'<span class="tk-tag new" style="margin:4px 0 0">次</span>':'')+'</div>'
  +'<div><h3>'+deco(y.name)+'</h3><div class="tk-chips">'+y.parts.map(p=>'<span>'+esc(p)+'</span>').join('')+'</div><ul>'+y.points.map(p=>'<li>'+deco(p,1)+'</li>').join('')+'</ul>'+(y.cmp?'<a href="#" class="tk-cmp" data-go="cmp" style="margin:0 12px 0 0">いまとくらべる →</a>':'')+(y.next?'<a href="#" class="tk-cmp" data-go="next" style="margin:0 12px 0 0">次の改訂 →</a>':'')+(y.url?'<a href="'+esc(y.url)+'" target="_blank" rel="noopener" class="tk-cmp" style="margin:0;color:var(--tk-sub)">出典：'+esc(y.src)+'</a>':'')+'</div></div>').join('');
}
function figHTML(){
 const F=D.histfig,C=F.cols,col=y=>C.indexOf(y)+2;
 let h='<div class="tk-fig"><div class="tk-fg"><div></div>'+C.map(y=>{const H=D.hist.find(x=>x.year===y);return '<div class="yh'+(H&&H.now?' now':'')+(H&&H.next?' next':'')+'">'+esc(y)+'<small>'+(H&&H.now?'いま':H&&H.next?'審議中':esc((H&&H.when||'').split('年')[0]))+'</small></div>';}).join('');
 F.lanes.forEach((L,r)=>{
  h+='<div class="ln" style="grid-row:'+(r+2)+'">'+esc(L.n)+'</div>';
  L.seg.forEach(([a,b,t])=>{const i=D.hist.findIndex(x=>x.year===a);
   h+='<button class="sg'+(a==='次'?' nx':'')+(t?'':' em')+(r===0?' nm':'')+'" data-y="'+i+'" style="grid-row:'+(r+2)+';grid-column:'+col(a)+'/'+(col(b)+1)+'" title="'+esc(a+(a!==b?'〜'+b:'')+'　'+t)+'">'+(t?esc(t):'<span aria-label="なし">―</span>')+'</button>';});
 });
 return h+'</div><div class="tk-fgk"><span><i></i>そのころの形（横に長い帯＝しばらく変わらなかった）</span><span><i class="nx"></i>次の改訂の案（まだ決まっていない）</span><span>帯を押すと、その年の説明へ</span></div></div>';
}
// スマホ用：年を縦、活動を横の列に入れかえた図（横に動かさずに全部見える）
function figHTMLv(){
 const F=D.histfig,C=F.cols,row=y=>C.indexOf(y)+2;
 let h='<div class="tk-figv"><div class="tk-fgv"><div></div>'+F.lanes.map((L,c)=>'<div class="lh" style="grid-column:'+(c+2)+'">'+esc(L.n)+'</div>').join('');
 C.forEach(y=>{const H=D.hist.find(x=>x.year===y);
  h+='<div class="yy'+(H&&H.now?' now':'')+(H&&H.next?' next':'')+'" style="grid-row:'+row(y)+'">'+esc(y)+'<small>'+(H&&H.now?'いま':H&&H.next?'審議中':esc((H&&H.when||'').split('年')[0]))+'</small></div>';});
 F.lanes.forEach((L,c)=>L.seg.forEach(([a,b,t])=>{const i=D.hist.findIndex(x=>x.year===a);
  h+='<button class="sg'+(a==='次'?' nx':'')+(t?'':' em')+(c===0?' nm':'')+'" data-y="'+i+'" style="grid-column:'+(c+2)+';grid-row:'+row(a)+'/'+(row(b)+1)+'">'+(t?esc(t):'<span aria-label="なし">―</span>')+'</button>';}));
 return h+'</div><div class="tk-fgk"><span><i></i>そのころの形（縦に長い帯＝しばらく変わらなかった）</span><span><i class="nx"></i>次の改訂の案</span></div></div>';
}
/* ---------- 次の改訂 ---------- */
function renderNext(){
 const N=D.next;
 $('tk-nav').innerHTML=N.steps.map(s=>'<button disabled style="opacity:1;cursor:default;'+(s.now?'border-color:var(--tk-new);font-weight:700':'')+'">'+esc(s.d)+'<small>'+esc(s.t)+(s.now?'（いまここ）':'')+'</small></button>').join('');
 $('tk-ttl').innerHTML='<b>次の 学習指導要領</b><span>'+esc(N.asof)+' に たしかめた内容</span>';
 $('tk-list').innerHTML='<ol class="tk-steps">'+N.steps.map(s=>'<li'+(s.now?' class="now"':'')+'><b>'+esc(s.d)+'</b>'+esc(s.t)+(s.now?'（いまここ）':'')+'</li>').join('')+'</ol><div class="tk-lead">'+deco(N.status,1)+'</div>'+N.items.map(x=>'<div class="tk-nx"><span class="tk-tag '+(NK[x.kind]||'shingi')+'" style="margin:0 8px 0 0">'+esc(x.kind)+'</span>'+deco(x.t,1)
  +'<div class="d">'+esc(x.date||'')+'　'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.src)+'</a>':esc(x.src||''))+'</div></div>').join('');
}
/* ---------- 用語 ---------- */
const ORDER=D.terms.map((t,i)=>i).sort((a,b)=>D.terms[a].yomi.localeCompare(D.terms[b].yomi,'ja'));
function where(i){
 const ws=D.terms[i].m||[D.terms[i].w],hit=r=>ws.some(w=>full(r).includes(w));
 return Object.values(NOW).filter(hit);
}
function termHTML(i,big){
 const t=D.terms[i],wh=where(i);
 return '<b>'+esc(t.w)+'</b><span class="y">'+esc(t.yomi)+'</span>'+(t.tag?'<span class="tk-tag '+(t.tag==='前回まで'?'gone':'new')+'">'+esc(t.tag)+'</span>':'')
  +'<p>'+deco(t.t)+'</p>'+(t.note?'<p style="font-size:14px;color:var(--tk-sub)">'+esc(t.note)+'</p>':'')
  +(wh.length?'<p style="font-size:15px">いまの本文では：'+wh.slice(0,big?20:4).map(r=>'<a href="#" class="tk-cmp" style="margin:0 8px 0 0" data-go="'+r.id+'">'+esc(SEC[r.sec]+(r.n&&r.n!==SEC[r.sec]?' '+r.n:''))+'</a>').join('')+(wh.length>(big?20:4)?'ほか':'')+'</p>':'<p style="font-size:14px;color:var(--tk-sub)">いまの本文には この語は出てきません</p>')
  +(t.rel?'<p style="font-size:15px">あわせて：'+t.rel.map(w=>{const j=D.terms.findIndex(x=>x.w===w);return j<0?'':'<a href="#" class="tk-w" data-t="'+j+'" style="margin-right:10px">'+esc(w)+'</a>';}).join('')+'</p>':'');
}
function renderTerm(){
 const GYO=[['あ','あいうえお'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],['た','たちつてとだぢづでど'],['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],['ま','まみむめも'],['や','やゆよ'],['ら','らりるれろ'],['わ','わをん']];
 let cur='';
 $('tk-nav').innerHTML=ORDER.map(i=>{const g=(GYO.find(x=>x[1].includes(D.terms[i].yomi[0]))||['他'])[0];let h='';if(g!==cur){cur=g;h='<h2>'+g+'行</h2>';}
  return h+'<button data-t="'+i+'" aria-pressed="'+(S.term===i)+'">'+esc(D.terms[i].w)+'</button>';}).join('');
 $('tk-ttl').innerHTML='<b>用語</b><span>学習指導要領と解説の ことば（解説をもとに 短く まとめたもの）</span>';
 $('tk-list').innerHTML=ORDER.map(i=>'<div id="t'+i+'" class="tk-card tk-ent'+(S.term===i?' on':'')+'">'+termHTML(i,true)+'</div>').join('');
 const el=$('t'+S.term);if(el)el.scrollIntoView({block:'start'});
}
/* ---------- さがす（辞典）---------- */
function renderFind(){
 const q=S.q,has=s=>s&&s.includes(q);
 $('tk-nav').innerHTML='';
 const g=(name,arr)=>arr.length?'<div class="tk-grp">'+name+'</div>'+arr.join(''):'';
 const res=(go,w,t)=>'<button class="tk-res" data-go="'+go+'"><span class="w">'+esc(w)+'</span>'+deco(t)+'</button>';
 const cut=t=>{const k=t.indexOf(q);return (k>40?'…':'')+t.slice(Math.max(0,k-40),k+80)+(t.length>k+80?'…':'');};
 const terms=D.terms.map((t,i)=>(has(t.w)||has(t.yomi)||has(t.t))?res('t'+i,'用語',t.w+'：'+cut(t.t)):'').filter(Boolean);
 const now=Object.values(NOW).filter(r=>has(full(r))).map(r=>res(r.id,'いまの本文　'+label(r),cut(full(r).replace(/\n/g,' '))));
 const old=D.pairs.filter(p=>(p.old||[]).some(i=>has(full(OLD[i])))).map(p=>{const r=OLD[p.old.find(i=>has(full(OLD[i])))];return res('p'+p.i,'前回の本文（平成20年）　'+label(r),cut(full(r).replace(/\n/g,' ')));});
 const hist=D.hist.map((y,i)=>{const t=[y.name,...y.parts,...y.points].find(has);return t?res('y'+i,'歩み　'+y.year,cut(t)):'';}).filter(Boolean);
 const nx=D.next.items.filter(x=>has(x.t)).map(x=>res('next','次の改訂',cut(x.t)));
 const all=g('用語',terms)+g('いまの本文',now)+g('前回の本文',old)+g('歩み',hist)+g('次の改訂',nx);
 $('tk-ttl').innerHTML='<b>「'+esc(q)+'」</b><span>本文・前回・歩み・次の改訂・用語から さがしました</span>';
 $('tk-list').innerHTML=all||'<div class="tk-none">見つかりませんでした</div>';
}
/* ---------- まとめて描く ---------- */
function render(){
 [...$('tk-mode').children].forEach(b=>b.setAttribute('aria-pressed',!S.q&&b.dataset.m===S.mode));
 $('tk-app').dataset.mode=S.mode;if(S.q)$('tk-app').dataset.q='1';else delete $('tk-app').dataset.q;
 if(S.q)renderFind();else({now:renderNow,cmp:renderCmp,hist:renderHist,next:renderNext,term:renderTerm})[S.mode]();
 $('tk-foot').hidden=S.mode!=='now'&&!S.pick.length;
 const ps=S.pick.map(c=>NOW[c]);
 $('tk-picked').textContent=ps.length?'選んだもの：'+ps.map(label).join('／'):'項目の右の □ を押すと、指導案に写せます';
 if(ps.length)$('tk-app').dataset.picked='1';else delete $('tk-app').dataset.picked;
 $('tk-clear').disabled=$('tk-copy').disabled=$('tk-send').disabled=!ps.length;

 const src=$('tk-list').querySelector('.tk-srcm');if(src)src.remove();
 $('tk-list').insertAdjacentHTML('beforeend','<div class="tk-srcm tk-sm"></div>');
 $('tk-src').textContent='作成：伊藤優／出典：'+(S.mode==='cmp'?D.src.old+'／':'')+D.src.now+(S.mode==='hist'||S.mode==='next'||S.mode==='term'?'／'+D.src_extra:'');
 $('tk-list').querySelector('.tk-srcm').textContent=$('tk-src').textContent;
 save();
}
function showCard(i){S.card=i;$('tk-card').innerHTML='<button class="x" aria-label="とじる">×</button>'+termHTML(i);$('tk-card').hidden=false;}
function go(to){
 S.q='';$('tk-q').value='';$('tk-qx').hidden=true;$('tk-card').hidden=true;
 if(to[0]==='t'&&!NOW[to]){S.mode='term';S.term=+to.slice(1);render();return;}
 if(to[0]==='p'){const p=D.pairs[+to.slice(1)];S.mode='cmp';S.sec=p.sec;S.onlyChg=false;S.hit=to;render();}
 else if(to[0]==='y'){S.mode='hist';render();S.hit='';}
 else if(to==='next'||to==='cmp'||to==='hist'){S.mode=to;render();return;}
 else if(NOW[to]){S.mode='now';S.sec=NOW[to].sec;S.hit=to;render();to='r'+to;}
 const el=$(to);if(el)el.scrollIntoView({block:'center'});
}
function open(code){if(NOW[code])go(code);}

/* ---------- 押したとき ---------- */
$('tk-mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;S.q='';$('tk-q').value='';$('tk-qx').hidden=true;S.hit='';$('tk-card').hidden=true;render();$('tk-list').scrollTop=0;};
$('tk-nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.s){S.sec=b.dataset.s;S.q='';$('tk-q').value='';$('tk-qx').hidden=true;S.hit='';render();$('tk-list').scrollTop=0;}
 else if(b.dataset.y){if(S.fig){S.fig=false;render();}$('y'+b.dataset.y).scrollIntoView({block:'start',behavior:'smooth'});}
 else if(b.dataset.t){S.term=+b.dataset.t;render();}};
$('tk-ttl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='tk-fig1'||b.id==='tk-fig0'){S.fig=b.id==='tk-fig1';render();$('tk-list').scrollTop=0;return;}if(b.id==='tk-mark')S.mark=!S.mark;if(b.id==='tk-only')S.onlyChg=!S.onlyChg;render();};
document.addEventListener('click',e=>{
 const w=e.target.closest('a.tk-w');if(w){e.preventDefault();if(S.mode==='term'&&!S.q){S.term=+w.dataset.t;render();}else showCard(+w.dataset.t);return;}
 const c=e.target.closest('a.tk-cmp,button.tk-res');if(c){e.preventDefault();go(c.dataset.p!=null?'p'+c.dataset.p:c.dataset.go);return;}
 if(e.target.closest('#tk-card .x')){$('tk-card').hidden=true;return;}
 const sg=e.target.closest('button.sg');if(sg){S.fig=false;render();const el=$('y'+sg.dataset.y);if(el)el.scrollIntoView({block:'start'});return;}
 const k=e.target.closest('button.tk-ck');if(k){const id=k.dataset.c,i=S.pick.indexOf(id);i<0?S.pick.push(id):S.pick.splice(i,1);S.hit='';const y=$('tk-list').scrollTop;render();$('tk-list').scrollTop=y;}
});
$('tk-q').oninput=e=>{S.q=e.target.value.trim();$('tk-qx').hidden=!S.q;$('tk-card').hidden=true;render();$('tk-list').scrollTop=0;};
$('tk-qx').onclick=()=>{$('tk-q').value='';S.q='';$('tk-qx').hidden=true;render();$('tk-q').focus();};
function toast(t){$('tk-toast').textContent=t;$('tk-toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('tk-toast').hidden=true,2200);}
const items=()=>S.pick.map(c=>({code:c,label:label(NOW[c]),text:NOW[c].t||NOW[c].h}));
$('tk-clear').onclick=()=>{S.pick=[];render();};
$('tk-copy').onclick=()=>{const t=items().map(x=>x.label+'\n'+x.text).join('\n\n');
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('写しました。指導案に はりつけできます'),()=>toast('写せませんでした'));};
$('tk-send').onclick=()=>{const m={type:'yoryo-pick',src:D.src.now,items:items()};
 if(window.parent!==window){window.parent.postMessage(m,'*');toast('授業メイトへ わたしました');}else toast('授業メイトの中で ひらくと わたせます');};
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='yoryo-open')open(d.code);});
window.DY_YORYO={open,get:c=>NOW[c]?{code:c,label:label(NOW[c]),text:NOW[c].t||NOW[c].h}:null};
const h=decodeURIComponent(location.hash.slice(1));
if(NOW[h])go(h);else render();
})();
</script>
</body></html>

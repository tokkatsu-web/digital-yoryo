<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>デジタル学習指導要領</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* デジタル学習指導要領の入口：教科ごとのページへのリンク集。教科が増えたら .yl-list に1つ足す */
:root{color-scheme:light;--yl-ink:#22252a;--yl-sub:#4a5260;--yl-line:#d6dbe2;--yl-soft:#f5f7fa;--yl-blue:#1a4fa0;--yl-blue2:#e8eef8;
 --yl-g:"BIZ UDPGothic","BIZ UDPゴシック","BIZ UDGothic","BIZ UDゴシック","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}body{background:#fff;color:var(--yl-ink);font-family:var(--yl-g);font-size:16px;line-height:1.75;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
.yl-app{max-width:880px;margin:0 auto;padding:32px 16px}
h1{margin:0;font-size:28px;line-height:1.4}
.yl-lead{margin:6px 0 24px;color:var(--yl-sub)}
.yl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.yl-list a,.yl-list .off{display:flex;flex-direction:column;gap:4px;min-height:120px;padding:16px 18px;border:1px solid #9aa3ad;border-radius:12px;background:#fff;color:inherit;text-decoration:none}
.yl-list a:hover{background:var(--yl-blue2);border-color:var(--yl-blue)}
.yl-list a:focus-visible{outline:3px solid var(--yl-blue);outline-offset:2px}
.yl-list b{font-size:22px;color:var(--yl-blue)}
.yl-list b::after{content:" →";font-weight:400}
.yl-list span{font-size:15px;color:var(--yl-sub)}
.yl-list .off{border-style:dashed;background:var(--yl-soft)}
.yl-list .off b{color:var(--yl-sub)}.yl-list .off b::after{content:""}
.yl-tag{align-self:flex-start;font-size:14px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;color:var(--yl-sub);background:#fff}
.yl-src{margin-top:28px;font-size:14px;color:var(--yl-sub);line-height:1.6}
</style></head><body>
<main class="yl-app">
 <h1>デジタル学習指導要領</h1>
 <p class="yl-lead">小学校学習指導要領（平成29年告示）を、引く・くらべる・たどる</p>
 <ul class="yl-list">
  <li><a href="tokkatsu/"><b>特別活動</b><span>いまの本文・前回（平成20年）とくらべる・歩み・次の改訂・用語</span></a></li>
  <li><div class="off" aria-disabled="true"><span class="yl-tag">準備中</span><b>国語</b><span>指導事項・単元から引く</span></div></li>
 </ul>
 <p class="yl-src">本文は 文部科学省「学習指導要領コード」（小学校・Ver1.2）と、国立教育政策研究所「学習指導要領データベース」によります。用語・歩み・次の改訂は、文部科学省・中央教育審議会の資料をもとに まとめたものです。</p>
</main>
</body></html>
